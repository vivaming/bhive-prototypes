 },
 "art-s34": {
  "title": "Minimum Wage Review Announced",
  "sections": [
   { "h": "Two numbers", "p": "ACT has proposed a training wage of $14.37 per hour for workers under 20, in place of the current $19.16 starting-out wage, which applies for the first 12 months with any employer. The party would also freeze the adult minimum wage at its current level of $23.95 for three years. The two figures have an arithmetic relation worth stating plainly: $14.37 is 60% of $23.95. That is the difference between two rates for the same work by two people who differ in age by a single year, and it is the number the union objected to." },
   { "h": "The union reading", "p": "CTU president Sandra Grey objected to the plan, which pays two people doing the same work at different rates (source not found for direct quotation). The coverage dates the announcement to 16 September. The wage proposal sits alongside the party's fiscal position of a faster path to surplus without new taxes, which makes the wage floor part of a package rather than an isolated rate. That is the difference from every other platform in the campaign: no other party has proposed a lower floor for a defined group of workers, and the comparison is with a floor rather than with an increase." },
   { "h": "The freeze in real terms", "p": "The three-year freeze on $23.95 has a measurable effect once the price data is applied. Inflation was 4.1% in the June 2026 quarter, and the core measure excluding food, household energy and vehicle fuel was 2.5%. A wage that does not move while prices rise loses ground every year it is held, and the loss compounds. Held for three years at the current annual rate, the real value of $23.95 falls by more than a tenth. The freeze is therefore not a pause in pay growth; it is a specified reduction in real pay, and its size is knowable before the vote." },
   { "h": "The cost of the comparison", "p": "The wage proposal was announced in the same fortnight as the cost-of-living debate reached its peak, with petrol up 27.5% year-on-year and the annual reading at 4.1%. In that context a lower training rate is a claim about who bears the adjustment, and it converts a grievance that all parties share into a policy that only one can propose. In the 1 to 3 September poll ACT was on 10.5%, up 3.2 points, and NZ First on 8.4%, and the two platforms are built on the same cost crisis: one lowers a floor and the other caps migration. Which of the two a voter reads as relief is the question the wage announcement puts on the table." },
   { "h": "What the coverage does not establish", "p": "No legislative text or instrument number for the training wage was available at collection time, and no effective date is stated. The figures are consistent with the party's announcement and with the CTU response, and both are reported_unconfirmed. The headline inflation figure of 4.1% for the June 2026 quarter published 21 July 2026 is officially confirmed; the 2.5% core reading and other breakdown rates quoted here are reported_unconfirmed, taken from the official release mirror rather than the release page itself. Any estimate of the real-pay effect of the freeze is a projection at the current annual rate rather than a forecast, and it should be labelled as such." },
   { "as_of": true, "p": "As of 16 September 2026 for the ACT wage proposal and the CTU response (RNZ, 16 September 2026, evidence state reported_unconfirmed; no URL retained at collection time). Rates for the June 2026 quarter CPI, published 21 July 2026 by Stats NZ: the headline 4.1% annual reading is officially_confirmed; the 2.5% core reading and other breakdown rates quoted here are reported_unconfirmed, taken from the official release mirror rather than the release page itself. Poll readings from the 1 to 3 September 2026 fieldwork. The real-pay effect of the freeze is stated in this briefing as a projection at the current annual rate, not a forecast. Source: https://www.stats.govt.nz/information-releases/consumers-price-index-june-2026-quarter/ . Named response: CTU president Sandra Grey, attribution noted; source not found for direct quotation." },
  ]
 },
 "art-s39": {
  "title": "Grocery Code Consultation Opens",
  "sections": [
   { "h": "Two remedies, one problem", "p": "On 16 September the governing party and the largest opposition party each announced a remedy for the price of food. National, which governs now in a three-party coalition with NZ First and ACT since 27 November 2023, said it would pursue a break-up of Foodstuffs, separating Pak'nSave from New World to increase competition. Labour, the opposition, said on the same day that it would ban large firms from charging excessive prices. The two remedies are structurally different and share a single precondition: neither can be implemented without an instrument that does not currently exist, and the one with the capacity to act on it now is the one already in office." },
   { "h": "The regulatory precondition", "p": "A break-up requires a Commerce Commission review before it can proceed, which places a campaign announcement and a completed review years apart. The statutory route is the same in kind: an excessive-pricing ban needs legislation, a defined test and an enforcement body. Foodstuffs responded on 17 September with a list of questions covering the cost of separation, the disruption to supply chains and the length of the transition. Pak'nSave's owner objected to the plan on cost grounds (source not found for direct quotation). Vegetable growers objected on cost grounds as well." },
   { "h": "What the price data shows", "p": "The remedies are aimed at a category that is not driving the current reading. In the June 2026 quarter the annual inflation reading was 4.1%, and petrol contributed roughly a quarter of that rise at 27.5% year-on-year, against 71.0% for other vehicle fuel and 12.0% for electricity. Excluding food, household energy and vehicle fuel, the core measure is 2.5%. Food prices are not the reason the reading reached 4.1%, and a remedy that addresses food prices is a remedy for a grievance rather than for the headline. That distinction is the whole of the argument, and it is the reason the debate has moved to structure and process rather than to the index." },
   { "h": "The trust question", "p": "Both remedies are commitments to future machinery. The government's own position is that a regulator must review the proposal before it can proceed, which is a fair process and a long one. As of 17 September 2026 neither a Commerce Commission consultation paper nor a bill for an excessive-pricing ban had been located at collection time, and neither party has stated a timetable. The coverage was unusually heavy for a policy with no instrument: more than ten reports across three newsrooms in 48 hours. A remedy that arrives with no timetable and no cost is cheap to announce and expensive to implement, and the difference between those two costs is what the campaign has not yet priced." },
   { "h": "What the coverage does not establish", "p": "No statutory instrument, consultation paper or costed model for either remedy was available at collection time. The policy positions, the responses from Foodstuffs and Pak'nSave are reported_unconfirmed. The headline inflation figure is officially confirmed for the June 2026 quarter; breakdown rates are reported_unconfirmed. Whether either remedy would lower grocery prices is not something the coverage answers, and the question is the one a Commerce Commission review would have to answer before the policy could be implemented." },
   { "as_of": true, "p": "As of 16 to 17 September 2026 for the policy announcements and stakeholder responses (RNZ, 1News and NZ Herald, 16 to 17 September 2026, evidence state reported_unconfirmed; no URLs retained at collection time). Rates for the June 2026 quarter CPI, published 21 July 2026 by Stats NZ: the headline 4.1% annual reading is officially_confirmed; the breakdown rates quoted here — petrol 27.5%, other vehicle fuel 71.0%, household electricity 12.0%, core 2.5% — are reported_unconfirmed, taken from the official release mirror rather than the release page itself. Governance note: National is not an opposition party; it has governed in coalition with NZ First and ACT since 27 November 2023, so the break-up is the position of the sitting government and the Labour remedy is the one that requires an election. Source: https://www.stats.govt.nz/information-releases/consumers-price-index-june-2026-quarter/ . Named responses on record: no named stakeholder spokesperson is quoted in the collected coverage, so none is quoted here; the policy positions are reported_unconfirmed." },

/* poll table: party vote bars from latest Curia poll (wp8-2) */

    { label: 'NAT', value: 29.0, color: '#5a94d4' },
    { label: 'LAB', value: 25.9, color: '#D82A20' },

  var w = container.clientWidth || 400, h = 240;

    .attr('preserveAspectRatio', 'xMidYMid meet');

  var labelW = w < 380 ? 70 : 90;

      .attr('fill', r.color).attr('opacity', r.value < 5 ? 0.4 : 0.85).attr('rx', 2);
    svg.append('text').attr('x', labelW + (r.value / 30) * (w - labelW - 60) + 6)
      .attr('y', yy + barH / 2 + 3.5).attr('font-size', 10.5).attr('font-weight', 600)

}

/* house-style party trend chart for a single party (colour + band + snapshot date) */
function drawPartyTrend(container, partyKey, partyLabel, latestVal, h) {
  var w = container.clientWidth || 400;
  var svg = d3.select(container).append('svg').attr('viewBox', '0 0 ' + w + ' ' + h).attr('width',w).attr('height',h)
    .attr('preserveAspectRatio', 'xMidYMid meet');
  var labelW = w < 340 ? 56 : 92;
  var hist = POLL_HISTORY[partyKey] || [30, 30, 30];
  var lo = Math.max(0, Math.min.apply(null, hist) - 4);
  var hi = Math.max.apply(null, hist) + 4;
  var x = d3.scaleLinear().domain([0, hist.length - 1]).range([8, w - labelW]);
  var y = d3.scaleLinear().domain([lo, hi]).range([h - 16, 8]);
  var color = (PARTY[partyKey] || {}).color || '#5a94d4';
  [lo, (lo + hi) / 2, hi].forEach(function (v) {
    svg.append('line').attr('x1', 10).attr('x2', w - labelW).attr('y1', y(v)).attr('y2', y(v))
      .attr('stroke', 'rgba(255,255,255,0.14)').attr('stroke-dasharray', '2,4');
    svg.append('text').attr('x', w - labelW + 6).attr('y', y(v) + 3)
      .attr('font-size', 8).attr('fill', '#6b7684').text(Math.round(v) + '%');
  });
  svg.append('line').attr('x1', x(hist.length - 1)).attr('x2', x(hist.length - 1))
    .attr('y1', 6).attr('y2', h - 16).attr('stroke', 'rgba(255,255,255,0.5)');
  svg.append('text').attr('x', x(hist.length - 1)).attr('y', 4).attr('text-anchor', 'middle')
    .attr('font-size', 8).attr('letter-spacing', '0.1em').attr('fill', '#9aa7b4').text('3 SEP');
  svg.selectAll(null).data(hist).enter().append('circle')
    .attr('cx', function (d, i) { return x(i); }).attr('cy', function (d) { return y(d); })
    .attr('r', 2.2).attr('fill', color).attr('opacity', 0.45);
  svg.append('path').datum(hist)
    .attr('d', d3.line().x(function (d, i) { return x(i); }).y(function (d) { return y(d); })
      .curve(d3.curveLinear))
    .attr('fill', 'none').attr('stroke', color).attr('stroke-width', 2);
  var last = hist[hist.length - 1];
  var ly = y(last);
  svg.append('circle').attr('cx', x(hist.length - 1)).attr('cy', ly).attr('r', 3.2).attr('fill', color);
  svg.append('text').attr('x', w - labelW + 6).attr('y', ly - 2)
    .attr('font-size', 10).attr('font-weight', 600).attr('fill', color).text(partyLabel);
  svg.append('text').attr('x', w - labelW + 6).attr('y', ly + 9)
    .attr('font-size', 9.5).attr('fill', '#c7cfd8').text(latestVal + '%');
  var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'];
  months.forEach(function (m, i) {
    svg.append('text').attr('x', x(i * (hist.length - 1) / (months.length - 1))).attr('y', h - 4)
      .attr('font-size', 8).attr('fill', '#6b7684').attr('text-anchor', 'middle').text(m);
  });
}

/* ── JS string escaper (XSS prevention) ───────────────────── */
function jsEscape(s) {
  var str = String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/\\/g, '\\');
  if (typeof str !== 'string') return str;
  return str.replace(/<\//g, '<\\/').replace(/script>/gi, 'script>');
}
function escAttr(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── Pagination: GSAP page-flip ────────────────────────────── */
function goToPage(np, dir) {
  if (np === pageNum || np < 1 || np > pageCount()) return;
  var tx=beginMotion();
  pageNum = np;
  flipping = true;
  updatePager();
  var animate = !reduced;
  if (animate) {
    /* exit: whole batch slides out toward -dir, 12ms stagger */
    Array.from(document.querySelectorAll('#grid .cell')).forEach(function(el,i){if(el.animate)el.animate([{transform:'translateX(0)',opacity:1},{transform:'translateX('+(-16*dir)+'px)',opacity:0}],{duration:100,delay:Math.min(80,i*3),easing:'cubic-bezier(.22,.61,.36,1)',fill:'forwards'});});
  }
  /* state transitions run on timers so the flip never stalls,
     even where rAF is throttled (hidden tabs); GSAP is paint only */
  settleMotion(tx,function() {
    renderGrid();
    if (animate) {
      var fresh = document.querySelectorAll('#grid .cell');
      /* enter: new batch slides in from +dir, 12ms stagger */
      fresh.forEach(function(el,i){if(el.animate)el.animate([{transform:'translateX('+(16*dir)+'px)',opacity:0},{transform:'translateX(0)',opacity:1}],{duration:200,delay:Math.min(80,i*3),easing:'cubic-bezier(.22,.61,.36,1)',fill:'both'});});
      /* settle guard: where the GSAP ticker never ticks (headless capture,
         hidden tabs) the enter tween's immediateRender leaves cells at
         opacity 0 — strip inline animation styles once the tween window
         has passed; a no-op in browsers where the tween completed */
      settleMotion(tx,function(){fresh.forEach(function(el){el.style.transform='';el.style.opacity='';});flipping=false;},280);
    }
    if(!animate) flipping=false;
  },animate?120:0);
}
(function initPager(){
  document.getElementById('pg-prev').addEventListener('click', function(){ goToPage(pageNum - 1, -1); });
  document.getElementById('pg-next').addEventListener('click', function(){ goToPage(pageNum + 1, 1); });
  window.addEventListener('keydown', function(e) {
    if (!document.getElementById('treemap-view').classList.contains('active')) return;
    if (e.key === 'ArrowRight') goToPage(pageNum + 1, 1);
    else if (e.key === 'ArrowLeft') goToPage(pageNum - 1, -1);
  });
  var tsX = null, tsY = null;
  document.getElementById('grid').addEventListener('touchstart', function(e) {
    tsX = e.touches[0].clientX; tsY = e.touches[0].clientY;
  }, { passive: true });
  document.getElementById('grid').addEventListener('touchend', function(e) {
    if (tsX === null) return;
    var dx = e.changedTouches[0].clientX - tsX;
    var dy = e.changedTouches[0].clientY - tsY;
    tsX = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) {
      if (dx < 0) goToPage(pageNum + 1, 1); else goToPage(pageNum - 1, -1);
    }
  }, { passive: true });
  /* demo/test hook: ?flip=1 auto-flips to page 2 after load */
  if (/[?&]flip=1(\b|$)/.test(location.search)) {
    setTimeout(function(){ goToPage(2, 1); }, 900);
  }
})();
