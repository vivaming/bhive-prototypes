/* ── Charts ────────────────────────────────────────────────── */
function drawPollChart(container, h, opts) {
  /* Shared cover/detail poll chart. Points are the recorded values, not a model or interval. */
  opts = opts || {};
  /* The cover chart lives in a flex-sized treemap card; size its viewBox to that
     rendered box so preserveAspectRatio cannot shrink otherwise readable text. */
  if (opts.fitContainer) h = Math.max(72, container.clientHeight || h);
  var w = container.clientWidth || 400;
  var svg = d3.select(container).append('svg').attr('viewBox', '0 0 '+w+' '+h).attr('width',w).attr('height',h)
    .attr('preserveAspectRatio','xMidYMid meet');
  var legendW = Math.min(160, Math.max(88, Math.round(w * (w < 420 ? 0.32 : 0.25))));
  var plotLeft = w < 340 ? 38 : 44;
  var plotRight = Math.max(plotLeft + 72, w - legendW - 14);
  var series = ['national','labour'];
  var maxPoints = Math.max.apply(null, series.map(function(k){return POLL_HISTORY[k].length;}));
  var lastIndex = maxPoints - 1;
  var x = d3.scaleLinear().domain([0, lastIndex]).range([plotLeft, plotRight]);
  var compact = !!opts.fitContainer && h < 150;
  var y = d3.scaleLinear().domain([20, 42]).range([h-(compact?17:23), compact?10:19]);
  if (!opts.nogrid) [20,25,30,35,40].forEach(function(v){
    svg.append('line').attr('x1',plotLeft).attr('x2',plotRight).attr('y1',y(v)).attr('y2',y(v))
      .attr('stroke','#2a3640').attr('stroke-width',1);
    svg.append('text').attr('x',plotLeft-8).attr('y',y(v)+3).attr('text-anchor','end')
      .attr('font-size',compact?8:(w<380?8:10)).attr('fill','#a6b2bc').text(v+'%');
  });
  svg.append('line').attr('x1',x(lastIndex)).attr('x2',x(lastIndex)).attr('y1',compact?8:14).attr('y2',h-(compact?16:20))
    .attr('stroke','#a6b2bc').attr('stroke-width',1);
  ['national','labour'].forEach(function(k){
    var c = PARTY[k].color;
    var data = POLL_HISTORY[k];
    svg.selectAll(null).data(data).enter().append('circle')
      .attr('cx',function(d,i){return x(i);}).attr('cy',function(d){return y(d);})
      .attr('r',3.2).attr('fill',c).attr('opacity',0.45).attr('tabindex',0)
      .attr('aria-label',function(d,i){return PARTY[k].name+' poll observation '+(i+1)+': '+d+' percent';})
      .each(function(d,i){d3.select(this).append('title').text(PARTY[k].name+' · observation '+(i+1)+': '+d+'%');});
    svg.append('path').datum(data)
      .attr('d', d3.line().x(function(d,i){return x(i);}).y(function(d){return y(d);})
        .curve(d3.curveLinear))
      .attr('fill','none').attr('stroke',c).attr('stroke-width',2.5);
    var lastIndex = data.length - 1;
    var last = data[lastIndex];
    var ly = y(last);
    svg.append('circle').attr('cx',x(lastIndex)).attr('cy',ly).attr('r',3.7).attr('fill',c);
  });
  var legendX = plotRight + 12;
  var legendFont = w < 380 ? 9 : (w < 640 ? 9 : 11);
  svg.append('line').attr('class','poll-legend-divider').attr('x1',plotRight+5).attr('x2',plotRight+5).attr('y1',compact?8:14).attr('y2',h-(compact?16:20))
    .attr('stroke','#33414b').attr('stroke-width',1);
  svg.append('text').attr('class','poll-legend-kicker').attr('x',legendX).attr('y',compact?10:22)
    .attr('font-size',legendFont).attr('font-weight',700).attr('letter-spacing','.08em')
    .attr('fill','#a6b2bc').text('LATEST · 3 SEP');
  series.forEach(function(k,i){
    var data=POLL_HISTORY[k],last=data[data.length-1],rowY=compact?31+i*23:45+i*44,color=PARTY[k].color;
    svg.append('line').attr('x1',legendX).attr('x2',legendX+8).attr('y1',rowY-3).attr('y2',rowY-3)
      .attr('stroke',color).attr('stroke-width',2.5);
    svg.append('circle').attr('cx',legendX+8).attr('cy',rowY-3).attr('r',2.5).attr('fill',color);

function drawMiniSpark(container, partyKey, h) {
  var big = h >= 70; /* V44 §4: visual weight follows spark height — desktop 72/80/96 sparks read heavier */
  var data = POLL_HISTORY[partyKey] || POLL_HISTORY.national;
  var w = container.clientWidth || 120;
  var c = PARTY[partyKey] ? PARTY[partyKey].color : '#8895a7';
  var svg = d3.select(container).append('svg').attr('viewBox','0 0 '+w+' '+h)
    .attr('preserveAspectRatio','xMidYMid meet');
  var x = d3.scaleLinear().domain([0, data.length-1]).range([2, w-46]);
  var lo = Math.min.apply(null, data) - 1.5, hi = Math.max.apply(null, data) + 1.5;
  var y = d3.scaleLinear().domain([lo, hi]).range([h-3, 3]);
  svg.append('path').datum(data)
    .attr('d', d3.line().x(function(d,i){return x(i);}).y(function(d){return y(d);})
      .curve(d3.curveMonotoneX))
    .attr('fill','none').attr('stroke',c).attr('stroke-width', big ? 1.5 : 1.25);
  var last = data[data.length-1];
  svg.append('circle').attr('cx',x(data.length-1)).attr('cy',y(last)).attr('r', big ? 3.0 : 2.4).attr('fill',c);
  svg.append('text').attr('x',w-1).attr('y',y(last)+3).attr('text-anchor','end')
    .attr('font-size', big ? 9.5 : 8.5).attr('font-weight',700).attr('fill',c).text(last+'%');
}

   { "h": "What overhang is", "p": "Under MMP, the proportion of seats a party wins by electorate is not always the same as the proportion its party vote entitles it to. When a party wins more electorates than its party vote share warrants, the extra seats are added to the parliament as overhang, expanding the total above the base figure of 120. The mechanism exists to prevent a candidate from winning a district and then losing the seat to the party-vote arithmetic. In 2023 it produced the largest parliament in New Zealand's history, at 123 seats." },
   { "h": "What 2023 actually delivered", "p": "The 2023 overhang came from three sources. Te Pāti Māori won two electorate seats that its party vote share did not entitle it to, producing two overhang seats. A third overhang seat came from Port Waikato, where the ACT candidate died before the vote and the resulting by-election produced a seat that the party-vote arithmetic did not account for. The parliament ended at 123, and the overhang mechanism is the reason National's government held a majority it would not have had under the pure party-vote arithmetic. The lesson of 2023 is that overhang is not a footnote; it is the mechanism that decides who governs in a narrow result." },
   { "h": "The strategic question", "p": "The political question for the 2026 election is not whether overhang will occur but whether it will decide the government. In a hung result the overhang mechanism could add multiple seats to any party that wins electorates it would not otherwise represent. For a party whose party vote falls short of the threshold but which wins a handful of safe electorates, overhang is the difference between government and opposition. RNZ reported that there are concerns parties may deliberately create overhang to influence the outcome after the 7 November vote, which is a claim about strategy rather than about rules." },
   { "h": "What the polls imply", "p": "On the most recent Curia Research poll National sits at 29.0%, Labour at 25.9%, the Greens at 13.9%, ACT at 10.5%, NZ First at 8.4% and the Opportunity Party at 4.5%. The party-vote gap between National and Labour is 3.1 points, which in a parliament of 123 is roughly four seats. Whether overhang fires depends on whether any party wins more electorates than its party vote share entitles it to, a condition that is more likely in a tightly contested result than in a two-party one. The 2023 precedent is the baseline: 123 seats, three overhang seats, and a government that would not have formed without them (RNZ, 16 September 2026)." }
  ]
},
 "art-s17": {
  "title": "TPM Energy Fund: The $1 Billion Question",
  "sections": [
   { "h": "What was announced", "p": "Te Pāti Māori announced on 16 September a proposal to establish an energy sovereignty fund of approximately $1 billion. The fund would operate through grants, concessional finance, guarantees, equity investment and co-investment, with the stated aim of giving hapū, iwi, marae, Māori landowners and communities a permanent share of energy assets. The programme also includes community energy storage, Māori energy enterprises and workforce development, framed as a means to lower household energy costs and increase resilience." },
   { "h": "The funding gap", "p": "What the proposal does not specify, and what the coverage does not resolve, is the source of the $1 billion. The RNZ and NZ Herald reports of 15 to 16 September did not quantify the funding mechanism, and no official document was available at the time of collection. Three structures are possible: debt-financed, at a rate that would carry an annual interest cost of roughly $32.5 million on the full $1 billion at the RBNZ cash rate of 3.25%; grant-financed, through a one-off levy, a tax change or a reallocation of existing energy subsidies; or revenue-financed, as a trust funded by future returns on energy assets it owns or a levy on energy use. Each structure produces a different fiscal burden and a different political cost." },
   { "h": "The paywalled analysis", "p": "The NZ Herald's coverage of the announcement is a Premium subscriber-only article published at 23:00 on 15 September, and its full analysis was not accessible in the open crawl of that day. RNZ's report did not specify the source, the governance structure or the timeline. What can be said is that the $1 billion figure is a round number, consistent with a political proposal rather than a budget line item, and that the mechanism that would make it a commitment is still open." },
   { "h": "Why the timing matters", "p": "The timing is not accidental. New Zealand's electricity market is due to update its long-run demand forecasts in the coming months, and the government's energy policy review is ongoing. A $1 billion fund would need to compete for attention and fiscal capacity in that same window. Whether Te Pāti Māori's proposal is a serious policy commitment or a negotiating position depends on whether the funding source is specified before the next budget cycle. As of 16 September 2026 it has not been, and the figure is still a proposal rather than a budget line (RNZ, 16 September 2026; NZ Herald, 15 September 2026)." }
  ]
},

 "art-wp6-1": {
  "title": "Labour Would Make Employer KiwiSaver Contributions Compulsory",
  "sections": [
   {
    "h": "What the policy actually says",
    "p": "Chris Hipkins unveiled Labour's KiwiSaver policy on Sunday from a Sharesies office in Wellington. The centrepiece is compulsory employer contribution: from 1 July 2028, employers must pay into every staff member's scheme. Two groups currently outside or loosely attached to the arrangement are brought in — workers on paid parental leave, and workers over 65. The minimum employer rate rises to 6 percent by 2032, and the party intends that floor to hold even when an employee reduces or pauses their own payments. Employees keep a 4 percent default, while the minimum employee rate is removed, giving workers more freedom to adjust their own contribution. Labour would also ban new total-remuneration contracts, which absorb KiwiSaver into salary so that an employee sees a single higher number on the payslip rather than a separate superannuation line."
   },
   {
    "h": "What echoes another party's package",
    "p": "Parts of the announcement were already on the table. In June, National proposed raising KiwiSaver contribution rates, and its package included contributions during parental leave — the same idea Labour now carries, a year later, alongside its extension to workers over 65. Earlier this year NZ First and National had also proposed automatic enrolment at birth, which Labour's package does not adopt. Where the ideas converge — compulsory employer payments, parents on leave still saving, older workers kept in the scheme — both camps are likely to claim credit for the shared architecture. For a reader following the policy space, the useful comparison is not which party invented the compulsory employer contribution but which can fund it: National's rate increase is a change to existing obligations, while Labour's package adds coverage and removes the employee floor at the same time."
   },
   {
    "h": "The funding question that decides it",
    "p": "The announcement leaves the money unsettled. Labour says the package will be funded by higher Employer Superannuation Contribution Tax revenue, with the detail to be worked through the Budget process. That is a real constraint, and worth stating plainly: the tax change has to clear Budget, not just the election. Making employer contribution compulsory while lifting the floor to 6 percent and expanding coverage to parental leave and the over-65s increases the size of the pool in several directions at once, so the employer tax has to absorb more than a small adjustment. Nothing in the announcement says how much the tax would rise, or how much employers would pay per worker in any given year. Whether a 6 percent employer floor survives contact with Budget arithmetic is the difference between a policy promise and a policy."
   }
  ]
 },
 "art-wp6-2": {
  "title": "Immigration NZ's $134 Million of Forecast Benefits, Ruled Flawed",
  "sections": [
   {
    "h": "Where the $134 million went",
    "p": "Immigration New Zealand overestimated the benefits from its Our Future Services rebuild by $134 million. That overstatement is more than a quarter of the $453 million in savings the programme was forecast to deliver. A new head of Immigration NZ told reporters the forecast productivity savings were \"virtually unheard of\", and the programme has now been paused. The total cost of Our Future Services stands at $336 million and over: a seven-year visa processing rebuild that was taken on the strength of benefits that no longer hold up to scrutiny. When a forecast fails by that margin, the issue is not whether the project was poorly managed but whether the approvals that funded it were made on an honest basis."
   },
   {
    "h": "The BCU precedent",
    "p": "This is not the first time an Immigration NZ technology programme has failed to deliver. The Biometric Capability Update cost around $36 million and took seven years before it was axed. The Privileges Committee later ruled that MPs had been deliberately misled over the decision to abandon it. Immigration NZ's record with large technology investments is therefore a matter of record rather than opinion. Both Our Future Services and the BCU are now under Public Service Commission review, and the Ministry of Business, Innovation and Employment has paused the work to reconsider the strategic case. The agency has spent a decade on two botched IT rebuilds; the question the review has to answer is whether the problem is technical, managerial, or something closer to how benefits get approved."
   },
   {
    "h": "What the Minister will not concede",
    "p": "Immigration Minister Erica Stanford says ministers were kept in the dark about the programme's problems, but does not believe the benefits were deliberately inflated. That is the line that matters, and it is a fine one. The BCU inquiry found deliberate misdirection and carried consequences for officials. A finding that Our Future Services was badly forecast but honestly presented is a different matter, with different accountability to answer for. For the government the distinction is consequential either way: a paused $336 million rebuild removes a promise about faster visa processing. Immigration has become the most travelled political ground this campaign, with NZ First and ACT proposing tighter controls at this year's immigration conference and the other parties responding to those proposals publicly. An agency cut by $134 million of overstated savings in that area becomes an election question, not just a procurement failure. The agency meant to deliver it is now the subject of a review into its own forecasting."
   }
  ]
 },
 "art-wp6-3": {
  "title": "Act's List: Paul Henry at Fourth, Sitting MPs at Risk",
  "sections": [
   {
    "h": "How a threshold party builds its list",
    "p": "Under MMP, a party below 5 percent of the party vote takes no list seats at all; a party above it takes seats in proportion to its vote. Act is comfortably above the line, which makes the party list the mechanism by which it converts poll support into a bench of MPs. The full list was released on Sunday, and it puts former broadcaster Paul Henry fourth. On current polling that is a seat he is certain to enter. All 11 current Act MPs are inside the top 12, except two who are retiring: Mark Cameron, and deputy leader Brooke van Velden, who is standing in Tāmaki and replaced on the list by James Christmas at seventh. The list therefore retains almost its entire sitting bench while inserting a public figure ahead of ministers and former ministers."
   },
   {
    "h": "Who the list actually puts at risk",
    "p": "The list's arithmetic turns on a single number: the party vote. In the latest Taxpayers' Union–Curia poll of 1–3 September, Act is on 10.5 percent, which would give it 12 or 13 seats on current projections — up from 11. At 10.5 percent, all 11 sitting members remain safe inside the top 12, and one additional seat opens up depending on how overhang seats fall. Todd Stephenson, at sixth, is secure; Parmjeet Parmar, ranked 10th, and Cameron Luxton at 12th are both clear of the cut-off. The leadership has shifted alongside the new entrant: Andrew Hoggard is up to third, and Nicole McKee is now deputy leader. Karen Chhour has been ranked on the list, and Henry's arrival at fourth pushes everyone below him down a place. The exposure is concentrated at the bottom of the ordering rather than spread evenly, which is what a two-seat gain looks like when the party vote sits more than five points above the threshold."
   },
   {
    "h": "Three pillars, and why the ordering is the point",
    "p": "Act says its campaign rests on three pillars: ending government waste, cutting red tape, and \"one law for all and one future together\". David Seymour said the list's diversity was not intentional, but emerged from a shared belief and specialist knowledge. That claim sits uneasily with the list itself, where a celebrity entrant placed ahead of a minister and a former minister holding a specialist portfolio is the most visible feature of the ordering. Putting Henry fourth, ahead of sitting members with a record of work in Parliament, is a statement about what Act thinks electors will look at in 2026. It also carries a cost: one incumbent loses a seat on current polling at 10.5%, and the party is betting that a higher-profile list buys votes it does not always deliver. The calculus is political rather than fiscal: a list that signals change attracts donors and volunteers, and that may compensate for the loss of a seat held by someone who does not campaign in person. The risk is that the list ordering looks theatrical rather than strategic, which is the impression the party invites critics to form.",
   }
  ]
 },
 "art-wp7-1": {
  "title": "Government scraps 2027 fuel tax hike, tops up transport fund by $1.476b",
  "sections": [{"h": "Policy reversal on fuel tax", "p": "The coalition government has cancelled the fuel tax increase that was set to take effect on 1 January 2027. Under the original plan, fuel taxes (including road user charges) would have risen by 12 cents per litre from that date. The new approach introduces a smaller first step: a 5 cent per litre increase from 1 January 2028. Thereafter, the tax will rise by another 5 cents every six months, so that by the end of 2029 the cumulative increase will be 20 cents per litre. From 2030 onward, the increase will revert to an annual 5 cent step, again inclusive of road user charges. The shift means the total additional cost to motorists over the next few years is lower than initially planned, though the tax will still climb over the decade."}, {"h": "Financing the Transport Fund", "p": "To offset the loss of revenue from the cancelled 12 cent hike, the government is directing $1.476 billion from the contingency reserve into the National Land Transport Fund. The transfer tops up the fund's medium-term forecast and removes the immediate funding gap that the original timetable would have created. The money comes from saved debt costs rather than new taxation, which is consistent with the coalition's fiscal stance. The top-up covers the shortfall through to 2029, when the revised timetable takes full effect, and does not commit to funding beyond that point. Whether the fund will need further injections depends on road construction costs and traffic growth, both of which are uncertain in an election year."}]
 },
 "art-wp7-2": {
  "title": "NZ First unveils sweeping immigration overhaul: resident visa cap referendum, 10-year welfare stand-down",
  "sections": [{"h": "NZ First announces immigration overhaul", "p": "On 11 September 2026, New Zealand First released a suite of 13 or more immigration policy proposals intended to shape the party's platform for the November general election. The centrepiece is a binding referendum that would set an annual ceiling of 20 000 resident visas, linked to a 30-year planning framework that coordinates immigration, housing and infrastructure. The package also tightens the path to citizenship: children born in New Zealand would no longer acquire automatic citizenship unless at least one parent is a citizen, permanent residence would be extended from two years to five years, and the qualifying period for citizenship would rise from five years to a minimum of ten years. A ten-year stand-down on most welfare benefits would apply to non-citizens, meaning they could not access Jobseeker Support or other main benefits for a decade. The proposals arrive as NZ First sits on 8.4 percent in the Taxpayers' Union–Curia poll, well above the 5 percent threshold that determines whether a party wins any list seats under MMP. That margin gives the party room to absorb a downturn without losing its parliamentary footing, which is the calculus behind hardening the immigration platform rather than moderating it."}, {"h": "The referendum mechanism", "p": "The resident visa cap would be decided by a binding national referendum, a first for New Zealand immigration policy. The government would be required to honour the outcome, setting an annual ceiling that caps the number of residence grants issued in each year. The 20 000 figure is framed as a planning anchor, not a quota that must be reached; it is a ceiling, not a floor. The referendum would be tied to a 30-year framework that links immigration targets to housing construction and infrastructure delivery, on the theory that population growth without matching capital investment drives the price pressures the party identifies as central to the cost-of-living crisis. Whether a binding referendum on immigration is constitutionally viable under existing law is a question the party has not yet answered."}, {"h": "Electoral arithmetic and threshold position", "p": "NZ First's 8.4 percent in the September Curia poll places it 3.4 points above the 5 percent MMP threshold, a comfortable buffer that insulates the party from the kind of seat loss that penalises parties hovering near the line. In the current parliament the party holds seven list seats and one electorate seat, giving it leverage in coalition negotiations that depends less on vote share than on the arithmetic of government formation. With National and Labour each sitting in the high 20s, a third party above threshold is routinely needed to assemble a majority. The immigration overhaul is designed to sharpen that leverage: by taking a position that is both electorally distinctive and structurally reinforcing, the party signals that its coalition value is tied to policy deliverables rather than procedural support. The risk is that a platform built on restriction narrows the party's appeal beyond its core electorate, but on current polling the threshold cushion makes that risk manageable through at least one election cycle."}]
 },
 "art-wp7-3": {
  "title": "Labour guarantees a public-health job for every NZ-trained graduate nurse",
  "sections": [{"h": "Labour’s graduate nurse job guarantee", "p": "Labour has committed to guaranteeing a public‑sector job for every newly qualified nurse who graduates from a New Zealand tertiary institution, should the party form the next government. The pledge would apply to the approximately 2 400 nursing graduates produced each year, directing them into existing pathways such as the graduate‑entry programme, hospital cadetships or other employment schemes already used by district health boards. Ayesha Verrall, the party’s health spokesperson, said the initiative is “about giving graduates certainty, strengthening the workforce, and improving care for patients.” She noted that the guarantee is a direct response to chronic staffing shortages, high overseas attrition and long waiting times for elective care, all of which have become prominent election issues. The guarantee is positioned as the centrepiece of Labour’s broader strategy to rebuild the nursing pipeline and retain talent within the public health system."}, {"h": "Cost and supporting measures", "p": "Labour estimates that guaranteeing a job for every graduate nurse would require about $525 million annually. This figure covers the salaries and associated on‑boarding expenses for the roughly 2 400 new nurses entering the workforce each year. In addition to the job guarantee, Labour proposes to double the existing recruitment subsidy for primary‑care nursing roles, increasing the financial incentive for clinics and iwi‑based health providers to hire nurses in community settings. The combined approach aims to boost both hospital‑based and community‑based nursing capacity while keeping the overall fiscal impact within the party’s announced election budget."}, {"h": "Background and electoral context", "p": "New Zealand’s health sector has been grappling with vacancy rates that strain district hospitals and long queues for specialist appointments. Many newly qualified nurses choose to work abroad shortly after registration, exacerbating domestic shortfalls. Waiting times for elective surgery and outpatient consultations have risen steadily, becoming a frequent topic in public debate and election coverage. Labour’s campaign has highlighted the graduate‑nurse guarantee as a way to offer immediate employment certainty, countering the perception that training investment is lost when nurses emigrate. By tying qualification to a guaranteed public‑sector role, the party seeks to strengthen the domestic pipeline and improve timely access to care for the population. The guarantee is presented as one pillar of Labour’s wider election commitment to rebuild the health workforce and reduce reliance on costly temporary staffing agencies."}]
 }
,
 "art-wp8-1": {
  "title": "ACT pledges faster path to surplus with no new taxes ahead of election",
  "sections": [{"h": "ACT’s fiscal pledge ahead of the election", "p": "ACT leader David Seymour said prior to the election the party will reveal its fiscal plan. Unlike every other party it will show a faster return to surplus, without imposing any new taxes. Seymour highlighted that New Zealand currently pays $24.8 million per day in debt interest, up from $10.1 million per day in 2018/19. He noted that by the time a reader finishes this press release, another $50,000 will have been lost to interest payments."}, {"h": "How ACT plans to reach surplus earlier", "p": "ACT claims that three budgets will deliver $14 billion in cuts, enabling an earlier surplus. This contrasts with National’s Budget Responsibility Rules, which target a surplus in 2028/29, debt below 40% of GDP, and spending reduced to 30% of GDP. Seymour criticised the National timeline as ‘three years late’, pointing out that current government spending sits at 32.6% of GDP and is unlikely to fall below 30% this decade."}, {"h": "Tax stance and government size", "p": "ACT reaffirmed its opposition to a capital gains tax, a wealth tax, an inheritance tax, and what it calls an ‘envy tax’. The party argues for a smaller, more efficient government. Seymour also noted that Budget 2026 has already achieved a surplus one year earlier than expected, providing a foundation for ACT’s fiscal approach."}, {"h": "Visual summary of key figures", "p": "The article’s source table presents four key figures: daily debt interest of $24.8 million; ACT‑driven cuts of $14 billion over three budgets; a surplus target set for 2028/29; and government spending at 32.6% of GDP."}]
 },
 "art-wp8-2": {
  "title": "Coalition would be returned in latest Curia poll; Opportunity falls below threshold, loses kingmaker bid",
  "sections": [{"h": "Latest Curia poll shows coalition ahead", "p": "The Taxpayers' Union–Curia poll was conducted from 1 to 3 September, sampling 1,000 respondents by phone and online, with a margin of error of ±3.1%. Results gave National 29% (down 2 points), Labour 25.9% (down 1.9), Greens 13.9% (up 3.8), ACT 10.5% (up 3.2), NZ First 8.4% (down 0.7), and Te Pāti Māori 2% (up 0.5)."}, {"h": "Opportunity Party falls below threshold", "p": "The Opportunity Party’s support fell from 6.1% to 4.5%, dropping below the 5% threshold required to hold kingmaker power in a close parliament. This shift removes its potential to act as a coalition broker and means the existing coalition can govern without needing its support."}, {"h": "Seat projection and government formation", "p": "Analysis of the poll numbers projects the current coalition (National + ACT + NZ First) at 64 seats, while the opposition bloc (Labour + Greens + Te Pāti Māori) sits at 56 seats. With Opportunity under the threshold, the coalition can form a government independently. Preferred prime‑minister ratings showed Luxon at 21.2% (down 2) and Hipkins at 16.9% (down 2.9)."}, {"h": "Visual summary of poll results", "p": "The party trend chart displays the September 3 poll figures: National 29%, Labour 25.9%, Greens 13.9%, ACT 10.5%, NZ First 8.4%, and Opportunity 4.5%."}]
 },
 "art-wp8-3": {
  "title": "Housing election forum: faith leaders and community housing groups to press parties on affordability",
  "sections": [{"h": "Faith and community groups host housing election forum", "p": "On 14 September, Wellington will host a national housing election forum bringing together faith leaders, community housing organisations, and individuals with lived experience of housing insecurity. The event is designed to allow these groups to question political parties directly on their housing policies. Housing affordability has been identified as a central issue in the 2026 general election."}, {"h": "Party proposals on housing affordability", "p": "National is promoting a 5% deposit scheme for first‑home buyers, aiming to lower the entry barrier into the market. NZ First is advocating a shared‑equity model that would give the state a stake in new homes to keep prices accessible. The Opportunity Party proposes a land tax as a tool to reduce house prices. OneRoof reporting noted that the Opportunity Party’s support is hovering near the 5% threshold."}, {"h": "Expert view on election policy and housing market", "p": "Economists warn that election‑year housing policies could influence market dynamics, but the precise impact of tax changes remains uncertain. They cited the OneRoof headline: “No steep decline in property prices - but it's not going to be rosy” to illustrate a mixed outlook where prices are not expected to crash, yet challenges remain."}, {"h": "Visual summary of housing proposals", "p": "The source table lists the three main housing proposals on display at the forum: National’s 5% deposit scheme, NZ First’s shared‑equity model, the Opportunity Party’s land tax, and the forum date of 14 September."}]
 },
 "art-wp8-4": {
  "title": "Government accepts 65 election-process changes recommended by Justice Committee",
  "sections": [{"h": "Government adopts Justice Committee’s election‑process recommendations", "p": "The Justice Committee’s regular post‑election inquiry produced 65 recommended changes to improve the electoral process. Justice Minister Paul Goldsmith announced that the Government has accepted every one of those recommendations."}, {"h": "Link to the four‑year term referendum", "p": "The recommendations arrive as the Term of Parliament Bill progresses, which would introduce a four‑year parliamentary term subject to a referendum. If the referendum were held alongside the 2026 general election, the public‑education window would be described by the committee as “very small”, raising concerns about voter understanding."}, {"h": "Election timeline and key dates", "p": "The 2026 election is scheduled for 7 November, with writ day on 4 October, nominations closing on 8 October, and overseas voting beginning on 21 October. These dates mean that any concurrent referendum would leave little time for an extensive public information campaign ahead of voting."}, {"h": "Visual summary of election‑process changes", "p": "The source table presents four items: the 65 accepted recommendations from the Justice Committee, the four‑year term referendum bill, the election date of 7 November, and the writ day of 4 October."}]
 },
  "art-s09": {
   "title": "Housing Prices Steady as Inventory Hits Records",
   "sections": [
    { "h": "Prices flat, activity down, listings up", "p": "New Zealand's house market stopped falling in price and started slowing in volume, according to REINZ's August 2026 snapshot. The national median sale price was $750,000, down 1.3% year-on-year. The House Price Index was 3,543, down 0.9% year-on-year. Both are flat in the sense that matters for a campaign built on a housing crisis: there is no longer a fast-moving price story, only a market that has stopped clearing." },
    { "h": "The activity gap", "p": "Confirmed sales fell to 5,430, down 13.0% year-on-year, making August the sixth-lowest August in REINZ's 35 years of records. New listings fell 5.1% to 8,326. Inventory rose 9.7% to 32,908. The gap between a 5% fall in new stock and a 10% rise in total stock is a market absorbing listings more slowly than they arrive. Properties took a median 51 days to sell, three days longer than August 2025 and the fourth-highest August figure on record. Auckland and Wellington have each experienced 31 consecutive months of year-on-year inventory growth." },
    { "h": "The regions do not move together", "p": "Inventory rose year-on-year in fourteen of the fifteen included regions, with Southland the only decrease. Gisborne recorded the largest increase, at 26.4%, from 122 to 154 properties. The two strongest price performers were Southland, with a median of $505,000 from 129 sales, up 7.4% year-on-year, and Tasman, with a median of $830,000 from 70 sales, up 5.6% year-on-year. A single national affordability number cannot be applied to a market where inventory is growing on one island and shrinking on the other." },
    { "h": "What the numbers do to the election argument", "p": "Housing is the issue the campaign has been framed around, and the August print reframes it. Prices are roughly flat and volume is falling, which is not the shape of a shortage. It is the shape of a surplus that has not yet reached prices. The political question is therefore not how fast the median rose but what a market of 32,908 listings does over a winter campaign. If buyers hold, sellers have to price to sell; if inventory keeps building, the pressure moves from listings to the price line. Neither party gets to own that dynamic." },
    { "as_of": true, "p": "As of 15 September 2026. Source: REINZ Snapshot, August 2026 data period, published 15 September 2026." }
   ]
  },
  "art-s15": {"title": "Dairy Payout Trimmed as Global Demand Softens",
   "sections": [
    { "h": "The auction that broke the trend", "p": "The Global Dairy Trade auction held on 15 September took the average price down 1.1% to US$3,868 (NZ$6,718), reversing a 0.1% rise at the previous auction two weeks earlier (RNZ, 16 September 2026). The direction matters more than the size. Two auctions in the other direction had given the market a base; this one removed it, and the split between products explains why." },
    { "h": "Fat falls, cheddar holds", "p": "Milkfat carried the fall. Butter was down 5.7%, consistent with the increase in Fonterra's butter offer quantities, while whole milk powder fell 0.8% to US$3,565 (NZ$6,191) and skim milk powder held relative ground. Cheddar moved against the trend, rising 16.5% with all contracts recording increases. Powder resilience against a fat correction is the pattern of a market testing where demand is genuine and where it is merely available." },
    { "h": "The buyer mix has shifted", "p": "North Asian purchasing fell from 46% to 37% of the market, with Southeast Asia, Oceania and the Middle East taking share. North Asia remains the largest whole milk powder buyer, though its share dropped from 51% to 40%, while Southeast Asia/Oceania took 60% of the skim milk powder offered. That is a geographic rotation in a key market, not a seasonal blip. Northern Hemisphere drought and heatwaves have yet to show up in published production data, and the El Niño risk for New Zealand has not yet materialised — the supply side is still open." },
    { "h": "What it does to the payout", "p": "The farm-gate message is a trim, not a crash: the average index is US$3,868 with butter down 5.7% and cheddar up 16.5%, which means a producer's payout depends heavily on which products it actually makes. Against a cost base that has not eased — fuel prices have risen alongside the conflict in Iran, and a separate RNZ survey published the same day found farmers pessimistic about next year's books despite decade-high profits — the dairy downturn is a story about margin, not about the index. The index tells the price; the margin tells the farm (RNZ, 16 September 2026)." }
   ]
  },
  "art-s06": {
   "title": "Migration Rebound of 20,300 Reshapes Coalition Arithmetic",
   "sections": [
    { "h": "Net migration more than doubled in a year", "p": "New Zealand's population grew by 20,300 people in the year to July 2026, a gain of plus or minus 1,800, against 9,600 — plus or minus 200 — in the same twelve months a year earlier. Arrivals rose 5% to 134,400, plus or minus 1,400. Departures fell 4% to 114,100, plus or minus 1,200. The movement sits on both sides at once: more people landing and fewer leaving. That is not the signature of a single cohort; it is a change in the direction of the whole flow." },
    { "h": "What the annual series actually says", "p": "The direction of travel is up from a low point rather than back to the record. Stats NZ's own headline for the release puts the comparison at 232,900 arrivals in the year to October 2023, the peak of the series. The July 2026 figure sits well below that peak but more than twice the year-earlier reading, which is a material difference in the shape of the story. A flow that has doubled off a trough is not the same thing as a flow that has returned, and the policy conversation has so far been framed as if it were the latter." },
    { "h": "The number is now big enough to argue about", "p": "At 20,300 the figure is large and official enough that no party can treat it as a statistical artefact. The proposal on the table to bind that number down is NZ First's, announced on 11 September as part of a suite of more than 13 immigration policy proposals: a binding referendum that would set an annual ceiling of 20,000 resident visas. Note the arithmetic of that comparison, because it is the whole argument in one line. A cap of 20,000 resident visas would sit almost exactly where the total net migration flow already stands, which makes the proposal a ceiling on a flow rather than a cut to one." },
    { "h": "The political read-through", "p": "The release lands in the middle of the campaign's most travelled political ground. NZ First is polling at 8.4% in the latest reading in the series, 3.4 points above the 5% party-vote threshold, and the party's platform is now built almost entirely around a figure that has just moved in its direction. Labour is on 25.9%, down 1.9 points from the previous reading, which is the shape of a party holding more of the left vote than the Green Party's gain can fully account for. The migration number has become the evidence base every immigration position in this campaign is being judged against, and it has landed on the side of the party that is furthest above the threshold." },
    { "as_of": true, "p": "As of 14 September 2026. Source: Stats NZ, International Migration: July 2026, published 14 September 2026." }
   ]
  },
  "art-s10": {
   "title": "ED Wait Targets Slip as Nurse Hiring Stalls",
   "sections": [
    { "h": "The headline number is two years old", "p": "The health system's headline emergency performance measure is a figure with a two-year-old label. The proportion of people admitted, discharged or transferred from emergency departments within six hours was 68% at the end of 2023. The latest published data put the proportion 'virtually unchanged' from 12 months earlier, and as low as 57% in some regions, against a government target of 95% nationwide by 2030. About a quarter of people are still waiting longer than six hours. That is the number both sides are arguing around, and it has not moved." },
    { "h": "Why no new official figure has been published", "p": "The reason the measure is a year behind is that its publisher stopped releasing it. Te Whatu Ora suspended quarterly publication of emergency department waiting data following a review that found the figures were inaccurate, an attribution made in New Zealand Herald reporting. The consequence is that neither government nor opposition has a current official number, so the argument runs off a 2023 reading and a claim of improvement rather than a measured change. That is the most consequential detail in the story, because it means the target is being argued about without being tracked." },
    { "h": "What the frontline is reporting instead", "p": "Where the official figure has frozen, the field reports have not. Auckland City Hospital said in September that winter conditions had been worse than expected. Tauranga Hospital emergency department staff declared a state of emergency on 15 September, warning of an ED they say is often running at 150 to 200 percent of capacity without the staffing needed; the modelling behind their letter to Health New Zealand's CEO Dale Bramley put the shortfall at 13.66 posts for 2025/26 and 16.78 for 2026/27. In July, staff at North Shore Hospital said some patients waited 50 hours. Those capacity figures are a staff estimate, not an official statistic." },
    { "h": "The two-year hiring number", "p": "Health Minister Simeon Brown said on 16 September that recruitment was happening up and down the country all of the time, and that he had never instructed Health NZ to cut hiring. The data puts a number on the period in question: only 54 new full-time-equivalent nurses were employed by Health NZ in the two years from March 2024 to March 2026. Two years of 54 nurses is not a hiring drive; it is a freeze expressed as an average." },
    { "h": "The political read-through", "p": "The argument is asymmetric. The coalition points to targets it reintroduced after Labour removed them in 2018, on the grounds that they created perverse incentives. Labour now has to argue that the targets were the problem, which is harder than the position it took in 2018, and its health policy is a placement commitment rather than a recruitment plan. The 68% figure is the evidence both sides have to work around, because it has not moved and its publisher is no longer publishing it." },
    { "as_of": true, "p": "As of 16 September 2026. Source: RNZ, 16 September 2026 and 15 September 2026, citing the Health NZ health targets dashboard and Health NZ employment data." }
   ]
  },
  "art-s05": {
   "title": "CPI Hits 4.1% as Petrol Adds 27.5%",
   "sections": [
    { "h": "The target band is no longer doing any work", "p": "Inflation rose 1.5% in the three months to June 2026, taking the 12-month increase to 4.1%. That is the highest annual reading since the December 2024 quarter, when CPI was 4.7%, and it is a full point above the March 2026 figure of 3.1%. The annual series has not printed below 2.2% since the September 2024 quarter, so even the recent low was at the top of the Reserve Bank's 1 to 3% target band. At 4.1% the economy is sitting a full point outside that band." },
   { "h": "One item explains most of the move, as reported", "p": "In the year to June, petrol rose 27.5% and is reported to account for 23.5% of the 4.1-point annual rise. Other vehicle fuels and lubricants rose 71.0%, and household electricity rose 12.0%. The percentage-point contributions behind those shares were not verified against the official release at collection time, so this briefing states rates and shares and gives no point contributions. Read together the three account for a majority of the annual increase, because other items moved the other way. That concentration matters politically: a price print built largely out of fuel and power is not a broad demand inflation, and it will not be turned around by the instrument that turns around broad demand inflation." },
   { "h": "The quarterly picture is sharper still", "p": "In the quarter itself petrol rose 20.1%, and other vehicle fuels rose 47.7%. Household purchasing of housing rose 1.6%. The offsets were specific too: fruit fell 8.5% and domestic accommodation services fell 12.0%. No point contributions are given for the quarter; the quarterly contribution table was not verified against the official release at collection time, so only the rates above were carried into this briefing. The domestic accommodation fall is the number to note, because it is the opposite of what a demand-led inflation story would predict, and it points at the same property market that REINZ's August data shows carrying 32,908 listings in inventory." },
   { "h": "Core and tradables", "p": "The underlying measures tell a different story from the headline. CPI excluding food, household energy and vehicle fuels rose 2.5% over the year, which is inside the target band. Tradeables rose 4.9% and non-tradeables 3.4%, so the imported component of the rise remains the faster one. That the split points at a terms-of-trade or currency problem rather than a domestic wage spiral is an inference from the composition, not a finding stated in the release; the release reports the split, not its cause. Strip out fuel and power and the annual reading is 2.5% rather than 4.1%." },
    { "h": "What the campaign gets from this quarter", "p": "The political use of 4.1% is a price list, and the price list is a fuel and power bill. The opposition can point at a print driven mainly by fuel and power and ask what a new budget does to it. Neither party gets to claim the print is being handled: the number is outside the target band, it moved up one full point in a single quarter, and its largest components are tax and wholesale energy rather than wages. That is the most uncomfortable shape a price release can take for a campaign running on affordability." },
   { "as_of": true, "p": "As of the June 2026 quarter, published 21 July 2026 by Stats NZ. The earlier label on this briefing, “as of 15 September 2026, published 15 September 2026”, was a publication-date error and has been corrected. Evidence split: the headline 1.5% quarterly and 4.1% annual readings are officially_confirmed against the Stats NZ release page. Every item and group breakdown in this briefing — petrol 27.5%, other vehicle fuels 71.0%, household electricity 12.0%, the quarterly rates, core 2.5%, tradeables 4.9% and non-tradeables 3.4%, and the 23.5% share of the annual rise attributed to petrol — is reported_unconfirmed, taken from the official release mirror rather than the release page itself. No point contribution in this briefing has been verified; shares are stated in place of them. Sources: https://www.stats.govt.nz/information-releases/consumers-price-index-june-2026-quarter/ (official release page) and https://www.nationaltribune.com.au/consumers-price-index-june-2026-quarter/ (official release mirror carrying the item table)." }
   ]
  },
  "art-s07": {
   "title": "Threshold Review: What 8.4% NZF Means Now",
   "sections": [
    { "h": "The green party is now the most interesting seat in the poll", "p": "The latest poll in the BIHIVE series puts National at 29.0%, down 2.0 points from the previous reading of 31.0%. Labour is on 25.9%, down 1.9 points from 27.8%. The Green Party is on 13.9%, up 3.8 points from 10.1%, the largest single-party gain in the series. ACT is on 10.5%, up 3.2 points from 7.3%. NZ First is on 8.4%, down 0.7 points from 9.1%. Read together, the coalition configuration is intact and the left bloc is now larger than the right, which is the structural fact the campaign has been avoiding." },
    { "h": "NZ First is above the line, but the question is what it buys", "p": "NZ First's 8.4% sits 3.4 points above the 5% party-vote threshold, so the party is projecting an electorate and list position that matters. What it buys is a seat at the coalition table, not a position of power. A party with 8.4% that is not needed to hold a majority is a participant in the outcome, and a party that is needed to hold one is the outcome. The gap between those two positions is the entire argument NZ First is having to make, and the poll gives it a margin it can work with." },
    { "h": "The two gains are not the same gain", "p": "Green's 3.8-point rise and ACT's 3.2-point rise are the same size of movement and the opposite direction of politics. ACT gains by taking the middle, which is the vote a party at 7.3% can afford to chase without being written off as minor. Green gains by taking the left of it, which is a vote that has to come from somewhere and is visibly coming from Labour, whose reading fell 1.9 points. The party losing the most absolute ground is not the party losing the most votes, because the gains are concentrated: National gave up 2.0 points and Labour 1.9, and the two left and right challengers took 7.0 of them." },
    { "h": "The political read-through", "p": "The configuration is the same as the one the previous reading suggested, with the difference that the challenger margin is now real rather than directional. National is still leading by a comfortable margin, but the party sitting just above the threshold has moved from a footnote to the most consequential number in the poll. NZ First at 8.4% is three and a half points clear of the line, and the immigration platform it is running on lands in the same week as the migration data release that put annual net migration at 20,300. The party with the specific policy on the live number is the party sitting furthest above the threshold, and that is a position that did not exist a month ago." },
    { "as_of": true, "p": "As of 1 September 2026. Source: poll series as recorded in the BIHIVE POLL_HISTORY series, most recent two readings." }
   ]
  },
  "art-s08": {
   "title": "Green Surplus Roadmap Meets Weak Growth",
   "sections": [
    { "h": "A platform built on constraint", "p": "The Green Party's surplus roadmap is the least glamorous and the most consequential of its campaign positions. The promise is a path to surplus without new taxes, which forces the whole programme to be financed by spending cuts rather than by revenue. That is a genuine discipline, and it is also the reason the plan has to be read against the state of the economy rather than against its own text. A surplus without new taxes is a statement about what a party is willing to take away, not about what it can raise." },
    { "h": "Growth is the hidden variable", "p": "The arithmetic of a spending-cut surplus requires the economy not to stop growing. If growth weakens before the cuts land, revenue falls at exactly the moment the gap is being closed, and the surplus turns from a target into a squeeze. For a party whose credibility on climate rests on sustained investment in energy and transport, the constraint is not ideological but cyclical. The roadmap only holds if the growth underneath it holds." },
    { "h": "Where the poll puts it", "p": "In the latest Taxpayers' Union–Curia poll of 1–3 September, the Greens were on 13.9%, up 3.8 points — the largest single gain of any party in the release (Curia, 3 September 2026). At that level the party is in the conversation about what a non-coalition government looks like, because any centre-left configuration requires the Greens, and NZ First becomes the alternative kingmaker. A fiscal credible path to surplus is what makes a party of that size usable by a coalition that does not share its politics." },
    { "h": "The test", "p": "The roadmap's value to voters is not its tone but its arithmetic. A party that can credibly show it will reach surplus without raising tax is the party an elector trusts with a tightening. The test is whether the Greens can deliver that while growth stays weak, and whether the coalition that would take them on would pay for it. The number that decides it is not the vote share; it is whether the cuts come before the growth." }
   ]
  },
  "art-s11": {
   "title": "Reshuffle Rumours Meet a Thin Ministerial Bench",
   "sections": [
    { "h": "A reshuffle in April, then silence", "p": "The last cabinet reshuffle is five months old. Prime Minister Christopher Luxon announced an election-year reshuffle on 2 April 2026, and the coverage of it focused on one departure: Chris Bishop, who lost the Leader of the House role and the position of election campaign chair. Since then the cabinet has not visibly moved. The rumours that circulate every winter are not reporting; they are the expectation that something will happen before the vote, written down as if it had already happened." },
    { "h": "Why a reshuffle would be expensive in an election year", "p": "Late in a term the incentive to reshuffle inverts. A reshuffle buys momentum but costs familiarity, and a government with a thin majority cannot afford unfamiliarity while its coalition partners are watching the polling. Ministers who have just been tested in parliament are unlikely to be moved, because the move reads as weakness in the same week. With the party-vote configuration still unsettled, the cost of promoting someone is a cost the coalition has to pay twice: once in the cabinet and once in the next polling release." },
    { "h": "What the polls say about the pressure", "p": "The polling provides the case for a move and the case against one. National is on 29.0% in the latest poll, down from 31.0% in the previous reading, while the coalition's overall configuration remains ahead. Labour is on 25.9%, down 5.5 points across the recorded series. A party falling while its partner holds is the pattern that normally produces movement, because the leader of the falling party is asked whether the bench should change. The counter-argument is the margin itself: the coalition is projected ahead, and a party that is winning an election rarely reshuffles." },
    { "h": "The more likely reading", "p": "Rumour is cheap and the cabinet is not. With the election-year reshuffle already spent in April, and with the polling showing a coalition still ahead, the option set is narrow: keep the same ministers and run on continuity, or move someone and pay for the move in the next poll. The April reshuffle was an election-year move, which argues that the leadership intended to settle the bench early rather than late. The cabinet that goes to the election is most likely the cabinet that already stands, and the reshuffle stories of the winter are the cheap part of the cycle doing the work the cabinet is not." },
    { "as_of": true, "p": "As of 2 April 2026 for the reshuffle event; poll readings from the 1 to 3 September 2026 poll series. Source: RNZ, 2 April 2026; poll data as recorded in the Beehive polling series." }
   ]
  },
 "art-s02": {
  "title": "Fuel Tax Retreat: The $1.4B Land Transport Fund Hole",
  "sections": [
   { "h": "The reversal", "p": "The coalition government has cancelled the fuel tax increase that was scheduled for 1 January 2027. The original plan would have raised fuel taxes, including road user charges, by 12 cents per litre from that date. The replacement timetable starts later and rises in smaller steps: 5 cents per litre from 1 January 2028, then a further 5 cents every six months, so that the cumulative increase reaches 20 cents by the end of 2029. From 2030 the pace returns to 5 cents per year, road user charges included. Nothing in the reversal removes the tax; it reschedules it." },
   { "h": "The fund hole", "p": "The revenue question is what the announcement was built around. The government intends to top up the National Land Transport Fund by $1.476 billion over the forecast period. Of that, $450 million comes from the fuel-response contingency set aside in Budget 2026, and the balance is to be found through the preliminary economic and fiscal update. Finance Minister Nicola Willis said the roughly $1 billion gap would be visible in that update by the end of September. Transport Minister Chris Bishop said that without the top-up, spending on road maintenance, public transport and infrastructure would face significant cuts. That is the shape of the decision: a tax deferred in exchange for a subsidy that must be found inside a forecast that is already closing." },
   { "h": "The Labour comparison", "p": "Labour's position on the same question is a three-year freeze on fuel tax. Chris Hipkins argued that New Zealanders simply cannot afford an extra 22 cents a litre, and Nicola Willis responded that the Labour plan would leave a $4.6 billion hole in the fund. Those two figures, $1.476 billion and $4.6 billion, are the whole arithmetic of the campaign on this issue, and neither has been audited. The government's number is a funding action; Labour's is an estimate of the cost of a freeze. They measure different things, and they are being compared as if they measured the same one." },
   { "h": "The price that drives the debate", "p": "The cost-of-living case for the reversal rests on petrol, and the petrol numbers are real. In the June 2026 quarter petrol was up 27.5% year-on-year and up 20.1% in the quarter alone, contributing roughly a quarter of the 4.1-point annual rise. Other vehicle fuel rose 71.0% and electricity 12.0%. Strip out food, household energy and vehicle fuel and the core measure is 2.5%. A tax that lands in 2028 is being argued about now because the price of the same product is already up a quarter, and because that quarter sits inside an inflation reading of 4.1%. Whether a 5 cent rise two years from now matters less than the 27.5% that has already happened is a case the government has not had to make, but it is the case being made." },
   { "h": "The explanation offered", "p": "Prime Minister Christopher Luxon has said the change is not about the election, citing changing circumstances and changing geopolitics. In March he described the increase as possibly unlikely. Between a leader calling something possibly unlikely in March and a government cancelling it in September there is a gap the campaign will ask about, and the defensible answer is the fund arithmetic rather than the calendar. As of 1 September 2026 the reversal is public and the funding is still to be specified." },
   { "as_of": true, "p": "As of 1 September 2026 for the policy reversal (RNZ, 1 September 2026, evidence state reported_unconfirmed; source not found at collection time). Rates for the June 2026 quarter CPI, published 21 July 2026 by Stats NZ: the headline 4.1% annual reading is officially_confirmed, while the breakdown rates quoted here — petrol 27.5% and 20.1% quarterly, other vehicle fuel 71.0%, household electricity 12.0%, core 2.5% — are reported_unconfirmed, taken from the official release mirror rather than the release page itself. Sources: https://www.stats.govt.nz/information-releases/consumers-price-index-june-2026-quarter/ and https://www.nationaltribune.com.au/consumers-price-index-june-2026-quarter/ (mirror). Named responses on record: Chris Hipkins, Nicola Willis, Chris Bishop and Christopher Luxon are attributed in the collected coverage; source not found for direct quotations." },
  ]
 },
 "art-s03": {
  "title": "NZ First Immigration Platform Lands",
  "sections": [
   { "h": "Thirteen proposals in a week", "p": "On 11 September NZ First released a suite of more than 13 immigration proposals. The centrepiece is legislation for a binding referendum that would set an annual ceiling of 20,000 resident visas, tied to a 30-year planning framework that coordinates immigration with housing and infrastructure. The rest of the package runs along the same line: children of citizens would acquire citizenship automatically, ending automatic citizenship for the children of residents; the residence period for permanent residence would rise from two years to five, and for citizenship from five to at least 10; non-citizens would be stood down from Jobseeker and Accommodation Supplement for 10 years; deportation would extend to any offence carrying a possible term of imprisonment, with automatic removal for specified violent, sexual, fraud, organised crime, money laundering and exploitation offences; protected-person status would become temporary and subject to ongoing assessment; overstayers would get a 24-month self-departure amnesty; student visa holders would have to leave the country to switch visas, with automatic work rights removed; social housing would be offered to citizens first; and fees would rise from $641 to $950 for citizenship and from $315 to $630 for permanent residence." },
   { "h": "The cap and the current number are different measures", "p": "The policy with the clearest test is the cap, and the test is available once the measures are kept apart. New Zealand's population grew by 20,300 people in the year to July 2026, plus or minus 1,800, against 9,600 plus or minus 200 in the same twelve months a year earlier. Arrivals rose 5% to 134,400 and departures fell 4% to 114,100. July on its own added 5,200. Those are net migration figures: arrivals minus departures. The proposal is not a net migration cap; it is an annual ceiling of 20,000 resident visas, which is a gross issuance count and a different measure altogether. The two numbers are numerically close, 20,000 against 20,300, but they measure different things and cannot be calibrated against one another: a visa cap is a gross issuance limit, net migration is arrivals minus departures. The closeness is coincidence, not correspondence." },
   { "h": "Where it separates from the partner", "p": "The 10-year welfare stand-down is the item most likely to be priced by voters rather than by ministers, and it is the item that separates NZ First from National. It is a citizenship-first rule that needs a statutory change rather than a housing or infrastructure plan to take effect. Labour's counter-proposal runs the other direction: Phil Twyford's managed migration, with a GPS requirement on immigration and a residence period of four years plus a civics requirement, while National has moved to tighten management as well. All three major platforms agree that population growth has to match housing, health and infrastructure capacity. They disagree on whether the constraint sits on the number, on the status, or on the sequencing." },
   { "h": "The polling position", "p": "In the Taxpayers' Union and Curia poll fielded from 1 to 3 September, NZ First was on 8.4%, down 0.7 points, with a margin of error of plus or minus 3.1%. That is a comfortable margin over the 5% threshold, and it is the figure that gives the party its position as a coalition partner rather than a negotiating target. Whether the 13 proposals add to or subtract from that position is not yet measurable: the package was released on 11 September, after that fieldwork had closed on 3 September, so the reading cannot have picked it up. What is measurable is that the proposals were framed as a platform for the November vote, and that they land in the same week as a migration release confirming the direction of travel they are arguing against." },
   { "h": "What the coverage does not establish", "p": "No legislative text, ballot paper or departmental submission for the package was available at collection time, and the stand-down, citizenship and fee items come from party announcements reported by RNZ on 11 September rather than from a bill. The migration figures are the official ones. That distinction matters: the policy side of this story is reported_unconfirmed and the population side is officially confirmed, so any statement that combines the two should carry the split with it." },
   { "as_of": true, "p": "As of 11 September 2026 for the NZ First package (RNZ, 11 September 2026, evidence state reported_unconfirmed). Migration figures for the year to July 2026, published 14 September 2026 by Stats NZ (officially_confirmed: the +20,300 annual gain, 134,400 arrivals and 114,100 departures); the July monthly figure of 5,200 is reported_unconfirmed. Poll readings from the 1 to 3 September 2026 fieldwork, margin of error plus or minus 3.1%. Source: https://www.stats.govt.nz/information-releases/international-migration-july-2026/ . No named on-record response: neither a NZ First spokesperson nor a National or Labour reply to the +20,300 figure carries a named direct quotation in the sources collected for this briefing, so none is quoted here." }
  ]
 },
 "art-s04": {
  "title": "Labour Guarantees Graduate Nurse Jobs",
  "sections": [
   { "h": "The pledge", "p": "Labour has committed that, if it forms the next government, it will guarantee a public-sector position to every nursing graduate qualified from a New Zealand tertiary institution, delivered through the employment schemes already in use such as graduate entry programmes and cadetships. The party estimates roughly 2,400 nursing graduates a year, and would also double the primary care recruitment subsidy. Health spokesperson Ayesha Verrall framed it as giving graduates certainty, strengthening the workforce and improving care for patients." },
   { "h": "The hiring rate it has to beat", "p": "The benchmark for any nurse hiring promise is the rate at which nurses have actually been added to the system. Te Whatu Ora data, as reported, show a net increase of 54 full-time equivalent nurses between March 2024 and March 2026, two years. Against an annual graduate intake the party estimates at 2,400, that is the difference between an offer and a hire. A job guarantee changes the offer: it makes the position certain at graduation rather than competitive after it. It does not change the number of positions that can exist, the pay that funds them, or the vacancy rate that sits between them." },
   { "h": "The emergency department evidence", "p": "The measure the pledge is meant to move is hard to state with a current number. The proportion of people admitted, discharged or transferred from an emergency department within six hours was 68% at the end of 2023, was described in the latest public coverage as virtually unchanged from the year before, and was as low as 57% in some regions, against a government target of 95% nationwide by 2030. The 68% is an end-2023 figure and must not be presented as today's. Te Whatu Ora has paused publication of the waiting data after a review found poor planning and overwhelmed data teams, so the measure that would test the pledge is not currently being reported on an official quarterly basis." },
   { "h": "The field report", "p": "On 15 September staff at Tauranga Hospital's emergency department declared a state of emergency, with more than 100 members of the nursing organisation involved, on the account that the department routinely runs at 150 to 200% of capacity short of people. A regional nurse staffing calculation put the need at 13.66 additional nurse or health assistant posts for 2025/26 and 16.78 for 2026/27 to reach a safe configuration, and a patient died in the waiting area on 25 August. The capacity figure is a staff estimate, not an official statistic, and it should be carried as one. The gap between an intake of 2,400 a year and a regional shortfall counted in single figures is the argument for a pipeline answer, and it is also the reason a hiring pledge cannot close it by itself." },
   { "h": "What the numbers cannot show", "p": "The pledge is a recruitment policy aimed at retention failure, and the data available at collection time do not establish the party's annual cost figure or its graduate intake figure against an official source; both come from the party announcement. What is available is the staffing record, the department evidence and the paused data set. Those three point in the same direction, and none of them can be moved by a guarantee." },
   { "as_of": true, "p": "As of 31 August to early September 2026 for the Labour pledge and its cost figures (NZ Herald, evidence state reported_unconfirmed; cost and intake figures not verified against an official source at collection time, and no URL retained). The net FTE gain of 54 nurses for March 2024 to March 2026 and the Tauranga report are reported_unconfirmed via RNZ, 15 to 16 September 2026, drawing on Te Whatu Ora data. The 68% emergency figure is end-2023 vintage and must not be presented as current. Sources: https://www.rnz.co.nz/news/health/1409610/simeon-brown-says-health-system-is-improving-despite-very-challenging-winter and https://www.rnz.co.nz/news/health/1383934/tauranga-hospital-emergency-department-staff-declare-state-of-emergency . Named responses on record: Labour health spokesperson Ayesha Verrall on the pledge; Health Minister Simeon Brown, quoted in the RNZ coverage as saying recruitment was happening and that he had never instructed Health NZ to cut hiring; and the 150 to 200% capacity estimate at Tauranga, attributed in that coverage to NZNO delegate John Wylie and carried here as a staff estimate rather than an official statistic." }
  ]
 },
 "art-s24": {
  "title": "Building Consent Backlog Grows",
  "sections": [
   { "h": "The $11 billion claim", "p": "The case for rebuilding the development contribution system rests on a single figure: $11 billion of infrastructure cost from new development over 2021 to 2031, paid for by existing ratepayers. Infrastructure Minister Chris Bishop's proposal is to abolish the development contributions regime and replace it with a development levy, on the principle that growth should pay for growth, with core government departments and Crown entities required to pay as well. The same claim is used for a second purpose, that the current system creates an artificial scarcity of land, so that the reform would release supply rather than merely move the cost." },
   { "h": "Who welcomed it", "p": "The reaction was unusual for a levy: councils and developers both welcomed the revamped instrument, according to the coverage of 17 September. The reason is in the design. Under the current regime the cost sits with the developer at consent stage, which is where a slow market lets the cost accumulate and where councils hold the leverage. Under a levy the obligation moves to ratepayers and to the government agencies that benefit, which is where the money is. The related revision to the local government legislation would let councils adjust contributions for out-of-sequence growth, and the coverage reports that in most cases that means developers paying more to councils." },
   { "h": "The first test", "p": "The first observable move came from Auckland, which has appealed a fast-track approval for the Delmore housing project, reported by the NZ Herald on 15 September. The appeal is the first case in which a council has used the revised rule set against a consent it disagrees with, and it is a test of whether the reform gives councils discretion or removes it. A fast-track approval that can be appealed is not a fast track; it is a contested one, and the outcome will set the tone for how the new regime is read at local level." },
   { "h": "The demand side", "p": "The reform is aimed at supply and has been announced into a market that has stopped clearing. In August 2026 the REINZ national median sale price was $750,000, down 1.3% year-on-year, and the house price index was 3,543, down 0.9%. Sales were 5,430, down 13.0%, the sixth-lowest August in 35 years. Listings were 32,908, up 9.7%, and the median time to sell was 51 days. Inventory in Auckland and Wellington has risen for 31 consecutive months on a year-on-year basis. The data do not show consents as the constraint; they show the absence of buyers, which is why a levy reform aimed at cost recovery would not be visible in August's sales numbers." },
   { "h": "What the data pack does not cover", "p": "The building consent series itself was not collected for this briefing, so no statement is made here about consent volumes, backlogs or processing times. The figures used are the REINZ August 2026 release and the coverage of the levy proposal, and the $11 billion is a government claim rather than an audited figure. As of 17 September 2026 the levy is announced, councils and developers are on record as welcoming it, and the first appeal has been filed." },
   { "as_of": true, "p": "As of 15 to 17 September 2026 for the levy proposal, the council response and the Delmore appeal (RNZ, 17 September 2026; NZ Herald, 15 September 2026, evidence state reported_unconfirmed; no URLs for that coverage retained at collection time). REINZ figures for August 2026, published 15 September 2026 (officially_confirmed). Building consent volumes were not collected for this briefing. Source: https://www.reinz.co.nz/Web/Web/News/News-Articles/Market-updates/National_prices_steady_amid_slower_activity_and_regional_variation.aspx . Named response on record: no named council or developer spokesperson is quoted in the collected coverage, so none is quoted here; the only named attribution is Infrastructure Minister Chris Bishop's paraphrased proposal to replace development contributions with a levy, which is a stated position and not a direct quotation." }
