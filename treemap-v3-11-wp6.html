<script>
"use strict";
  var armedId = null, armTime = 0, armTimer = null, MQ_SPEED = 28, MQ_GAP = 28;
  function clearMq(el) {
    if (!el) return;
    var ov = el.querySelector('.mq-overlay');
    if (ov) { ov.remove(); }
    var ti = el.querySelector('.cell-title');
    if (ti && ti.style.color === 'transparent') ti.style.color = '';
    el.classList.remove('armed');
  }
  function armCard(el) {
    clearMq(document.querySelector('.cell.armed'));
    el.classList.add('armed'); armTime = performance.now();
    armedId = el.dataset.id;
    if (reduced) return; /* reduced-motion: static ring selection */
    var ti = el.querySelector('.cell-title'); if (!ti) return;
    ti.style.width = 'max-content';
    var textW = ti.scrollWidth;
    ti.style.width = '';
    var boxW = ti.clientWidth;
    /* first-line height via Range (Astra spec #2) */
    var range = document.createRange();
    range.selectNodeContents(ti);
    var lineH = range.getClientRects().length ? range.getClientRects()[0].height
              : (parseFloat(getComputedStyle(ti).lineHeight) || 14);
    var P = textW + 28;
    var N = Math.max(2, Math.ceil((boxW + P) / P));
    var ov = document.createElement('div');
    ov.className = 'mq-overlay';
    ov.style.left = '0px';
    ov.style.width = boxW + 'px';
    ov.style.height = lineH + 'px';
    ov.style.alignItems = 'flex-start';
    var mqNarrow = window.innerWidth < 480 || /[?&]narrow=1/.test(location.search);
    ov.style.top = mqNarrow ? '0px' : ((ti.clientHeight - lineH) / 2) + 'px';
    var tr = document.createElement('span');
    tr.className = 'mq-track';
    var oneCopy = '<span class="mq-text">' + ti.innerHTML + '</span><span class="mq-gap"></span>';
    var copies = '';
    for (var ci = 0; ci < N + 1; ci++) copies += oneCopy;
    tr.innerHTML = copies;
    ti.style.color = 'transparent'; /* hide original; ::after underline stays */
    ov.appendChild(tr);
    ti.appendChild(ov);
    tr.style.setProperty('--mq-dur', (P / 28) + 's');

  }
  /* two-level interaction: first tap = select (+marquee), second tap on the same card = article */
  function wireCard(el, story) {
    el.setAttribute('tabindex', '0'); /* Enter walks the same state machine */
    var activate = function () {
      if (el.classList.contains('armed')) {
        if (performance.now() - armTime < 250) return; /* <250ms second tap is not a confirm */
        clearMq(el); openArticle(story); return;
      }
      armCard(el);
    };
    el.addEventListener('click', activate);
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); activate(); }
    });
  }
  /* single date emission point — every visible date goes through this helper */
  function dateHtml(c, cls) { return '<span class="'+cls+'">'+(c.date||'')+'</span>'; }
function isOldDate(dateStr) {
  if (!dateStr) return false;
  var parts = dateStr.split(' ');
  if (parts.length !== 2) return false;
  var day = parseInt(parts[0], 10);
  var monthStr = parts[1].toUpperCase();
  var monthMap = {
    'JAN':0, 'FEB':1, 'MAR':2, 'APR':3, 'MAY':4, 'JUN':5,
    'JUL':6, 'AUG':7, 'SEP':8, 'OCT':9, 'NOV':10, 'DEC':11
  };
  var month = monthMap[monthStr];
  if (isNaN(day) || month === undefined) return false;
  var date = new Date(2026, month, day);
  var ref = new Date(2026, 8, 16); // September is 8 (0-indexed), 16th
  var diffTime = ref - date;
  var diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
  return diffDays > 7;
}
function getSourceHtml(c) {
  // wp6-1/wp6-2/wp7-1/wp7-3 → via RNZ
  // wp6-3/wp7-2/wp8-1/wp8-3/wp8-4 → via NZ Herald
  // wp8-2 → via Curia
  if (c.wp6 === 'wp6-1' || c.wp6 === 'wp6-2' || c.wp7 === 'wp7-1' || c.wp7 === 'wp7-3') {
    return '<span class="source">via RNZ</span>';
  } else if (c.wp7 === 'wp7-2' || c.wp8 === 'wp8-1' || c.wp8 === 'wp8-3' || c.wp8 === 'wp8-4' || c.wp6 === 'wp6-3') {
    return '<span class="source">via NZ Herald</span>';
  } else if (c.wp8 === 'wp8-2') {
    return '<span class="source">via Curia</span>';
  }
  return ''
}
/* demote overflowing ids to the head of the next page (new page if the last overflows) */
  function demote(ids) {
    var pages = pagesFor(activeCat), pi = pageNum - 1, changed = false;
    ids.forEach(function(id){
      var pg = pages[pi] || [];
      var ix = pg.indexOf(id);
      if (ix < 0) return;
      if (demotedIds[id]) { console.warn('[fit] ' + id + ' still overflows after one demotion — kept in place'); return; }
      pg.splice(ix, 1);
      if (pi + 1 < pages.length) pages[pi + 1].unshift(id);
      else pages.push([id]);
      demotedIds[id] = true;
      changed = true;
    });
    if (!changed) return;
    if (!pages[pi] || !pages[pi].length) pages.splice(pi, 1); /* current page emptied by demotion */
    if (pageNum > pages.length) pageNum = pages.length;
    renderGrid();
  }
  /* fit audit: no clipped titles, no cropped tag rows, exactly one date node per card */
  function fitAudit(grid) {
    var bad = [];
    grid.querySelectorAll('.cell').forEach(function(el){
      var t = el.querySelector('.cell-title'), tr = el.querySelector('.tag-row');
      if (!t || !el.dataset.id) return; /* logo cell carries neither title nor date */
      if (el.classList.contains('p0')) return; /* hero card: fixed full-width headline, never demoted */
      var cb = el.getBoundingClientRect().bottom;
      if (t.scrollHeight > t.clientHeight + 1) bad.push(el.dataset.id);                    /* title does not fit */
      else if (tr && tr.getBoundingClientRect().bottom > cb - 2) bad.push(el.dataset.id);  /* tag row cropped */
      if (/[?&]audit=1/.test(location.search)) {
        var n = el.querySelectorAll('span[class*=date]').length;
        var wpx = parseFloat(el.style.width) || 0;
        if (n !== (wpx < 70 ? 0 : 1)) console.warn('[audit] ' + el.dataset.id + ': ' + n + ' date node(s), expected ' + (wpx < 70 ? 0 : 1));
      }
    });
    if (bad.length) demote(bad);
  }

  /* ── V44 §2: desktop-only title autofit — mobile keeps tier sizes ── */
  function contentH(ti) { var rg = document.createRange(); rg.selectNodeContents(ti); return rg.getBoundingClientRect().height; }
  function fitTitleAll(grid) {
    grid.querySelectorAll('.cell-title').forEach(function(ti){
      var cell = ti.closest('.cell');
      var availW = ti.clientWidth, availH = ti.clientHeight;
      if (availW < 60 || availH < 20) return;            /* degenerate cells keep the tier default size */
      var frozen = ti.style.flex;
      ti.style.flex = '0 0 ' + availH + 'px';            /* hero: freeze the flex slack share before measuring */
      var CAP = Math.max(13, Math.min(availW/16, availH/2, 44)); /* size-keyed cap — tier hierarchy reads from cell area, not font */
      var lo = 13, hi = CAP, best = 13;
      while (hi - lo >= 0.5) {                           /* 0.5px binary search */
        var m = (lo + hi) / 2;
        ti.style.fontSize = m + 'px';
        if (contentH(ti) <= availH * 0.90) { best = m; lo = m; } /* under 90% full → grow */
        else hi = m;
      }
      ti.style.fontSize = best + 'px';
      if (contentH(ti) > availH) while (best > 6 && contentH(ti) > availH) { best -= 0.5; ti.style.fontSize = best + 'px'; } /* still overflowing → shrink so fitAudit never demotes */
      ti.style.flex = frozen;
      if (cell.classList.contains('p0')) ti.style.flex = '0 0 auto'; /* V44 §3: hero title hugs its content; chart (flex:1) absorbs the slack */
    });
  }

/* ── Charts ────────────────────────────────────────────────── */
function drawPollChart(container, h, opts) {
  /* Cover card: brief-page main chart DNA — TWO MAJOR PARTIES ONLY (National vs Labour),
     model lines + confidence bands + poll dots + right-edge name/value labels,
     dashed % gridlines, Today anchor, teal under-5% zone. Mini-sparkline projection style.
     opts.nogrid: skip dashed gridlines (narrow hero — they read as clutter at 110px). */
  opts = opts || {};
  var w = container.clientWidth || 400;
  var svg = d3.select(container).append('svg').attr('viewBox', '0 0 '+w+' '+h)
    .attr('preserveAspectRatio','none');
  var labelW = w < 340 ? 56 : 92;
  var x = d3.scaleLinear().domain([0, 9]).range([8, w-labelW]);
  var y = d3.scaleLinear().domain([20, 42]).range([h-16, 8]);
  // dashed gridlines with % labels on right (house style) — domain fits the two majors
  if (!opts.nogrid) [20,25,30,35,40].forEach(function(v){
    svg.append('line').attr('x1',10).attr('x2',w-labelW).attr('y1',y(v)).attr('y2',y(v))
      .attr('stroke','rgba(255,255,255,0.14)').attr('stroke-dasharray','2,4');
    svg.append('text').attr('x',w-labelW+6).attr('y',y(v)+3)
      .attr('font-size',8).attr('fill','#6b7684').text(v+'%');
  });
  svg.append('line').attr('x1',x(8.6)).attr('x2',x(8.6)).attr('y1',6).attr('y2',h-16)
    .attr('stroke','rgba(255,255,255,0.5)');
  svg.append('text').attr('x',x(8.6)).attr('y',4).attr('text-anchor','middle')
    .attr('font-size',8).attr('letter-spacing','0.1em').attr('fill','#9aa7b4').text('TODAY');
  ['national','labour'].forEach(function(k){
    var c = PARTY[k].color;
    var data = POLL_HISTORY[k];
    svg.append('path').datum(data)
      .attr('d', d3.area().x(function(d,i){return x(i);})
        .y0(function(d){return y(d-1.3);}).y1(function(d){return y(d+1.3);})
        .curve(d3.curveMonotoneX))
      .attr('fill',c).attr('opacity',0.16).attr('fill-opacity',0.12);
    svg.selectAll(null).data(data).enter().append('circle')
      .attr('cx',function(d,i){return x(i);}).attr('cy',function(d){return y(d);})
      .attr('r',2.2).attr('fill',c).attr('opacity',0.45);
    svg.append('path').datum(data)
      .attr('d', d3.line().x(function(d,i){return x(i);}).y(function(d){return y(d);})
        .curve(d3.curveMonotoneX))
      .attr('fill','none').attr('stroke',c).attr('stroke-width',2);
    var last = data[data.length-1];
    var ly = y(last);
    svg.append('circle').attr('cx',x(9)).attr('cy',ly).attr('r',3.2).attr('fill',c);
    var nameFs = w < 340 ? 8 : 10;
    var valFs = w < 340 ? 8.5 : 9.5;
    svg.append('text').attr('x',w-labelW+6).attr('y',ly-2)
      .attr('font-size',nameFs).attr('font-weight',600).attr('fill',c).text(PARTY[k].name);
    svg.append('text').attr('x',w-labelW+6).attr('y',ly+9)
      .attr('font-size',valFs).attr('fill','#c7cfd8').text(last+'%');
  });
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep'];
  months.forEach(function(m,i){
    svg.append('text').attr('x', x(i)).attr('y', h-4)
      .attr('font-size',8).attr('fill','#6b7684').attr('text-anchor','middle').text(m);
  });
}

function drawMiniSpark(container, partyKey, h) {
  var big = h >= 70; /* V44 §4: visual weight follows spark height — desktop 72/80/96 sparks read heavier */
  var data = POLL_HISTORY[partyKey] || POLL_HISTORY.national;
  var w = container.clientWidth || 120;
  var c = PARTY[partyKey] ? PARTY[partyKey].color : '#8895a7';
  var svg = d3.select(container).append('svg').attr('viewBox','0 0 '+w+' '+h)
    .attr('preserveAspectRatio','none');
  var x = d3.scaleLinear().domain([0, data.length-1]).range([2, w-46]);
  var lo = Math.min.apply(null, data) - 1.5, hi = Math.max.apply(null, data) + 1.5;
  var y = d3.scaleLinear().domain([lo, hi]).range([h-3, 3]);
  svg.append('path').datum(data)
    .attr('d', d3.area().x(function(d,i){return x(i);})
      .y0(function(d){return y(d-0.9);}).y1(function(d){return y(d+0.9);})
      .curve(d3.curveMonotoneX))
    .attr('fill',c).attr('opacity',0.10);
  svg.append('path').datum(data)
    .attr('d', d3.line().x(function(d,i){return x(i);}).y(function(d){return y(d);})
      .curve(d3.curveMonotoneX))
    .attr('fill','none').attr('stroke',c).attr('stroke-width', big ? 1.5 : 1.25);
  var last = data[data.length-1];
  svg.append('circle').attr('cx',x(data.length-1)).attr('cy',y(last)).attr('r', big ? 3.0 : 2.4).attr('fill',c);
  svg.append('text').attr('x',w-1).attr('y',y(last)+3).attr('text-anchor','end')
    .attr('font-size', big ? 9.5 : 8.5).attr('font-weight',700).attr('fill',c).text(last+'%');
}

function thresholdBars(container) {
  var html = '<div class="th-line" style="left:'+(5/45*100)+'%"></div>' +
    '<div class="th-label" style="left:'+(5/45*100)+'%">5%</div>';
  var abbrMap = {national:'NAT', labour:'LAB', green:'GRN', act:'ACT', nzfirst:'NZF'};
  Object.keys(PARTY).forEach(function(k){
    var p = PARTY[k];
    var w = Math.min(100, p.poll/45*100);
    var abbr = abbrMap[k] || k.toUpperCase().substring(0,3);
    html += '<div class="th-row"><div class="th-name">'+p.name+' <span class="th-abbr">'+abbr+' '+p.poll+'</span></div>' +
      '<div class="th-track"><div class="th-bar'+(p.reached?'':' below')+
      '" style="width:'+w+'%; background:'+p.color+'"></div></div>' +
      '<div class="th-val">'+p.poll+'%</div></div>';
  });
  html += '<div class="mmp-note">MMP: a party enters Parliament by clearing 5% party vote OR winning one electorate seat.</div>';
  container.innerHTML = html;
}
function legendRow() {
  var html = '';
  Object.keys(PARTY).forEach(function(k){
    html += '<span class="li"><span class="dot" style="background:'+PARTY[k].color+'"></span>'+PARTY[k].name+'</span>';
  });
  return html;
}

/* ── Treemap layout ────────────────────────────────────────── */
var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

var activeCat = 'all';
var PAGE_SIZE = 30, pageNum = 1, flipping = false;
/* pageMap: per-category array of pages (id arrays) — demotion moves ids between pages */
var pageMap = {}, demotedIds = {}, lastPageSize = 0;
function pageSize(){ var n = window.innerWidth < 480 || /[?&]narrow=1/.test(location.search); return n ? 9 : PAGE_SIZE; }
function catStories(cat) {
  var k = cat === undefined ? activeCat : cat;
  var s = CELLS.filter(function(c){ return !c.logo && (k === 'all' || c.cat === k); });
  s.sort(function(a, b){ return a.tier - b.tier; }); /* stable: hot-first array order within tier */
  return s;
}
function pagesFor(cat) {
  if (pageSize() !== lastPageSize) { pageMap = {}; demotedIds = {}; lastPageSize = pageSize(); } /* granularity changed (resize): rebuild */
  if (!pageMap[cat]) {
    var s = catStories(cat), ps = pageSize(), pages = [];
    for (var i = 0; i < s.length; i += ps) pages.push(s.slice(i, i + ps).map(function(c){ return c.id; }));
    pageMap[cat] = pages.length ? pages : [[]];
  }
  return pageMap[cat];
}
function pageCount() { return pagesFor(activeCat).length; }
function pageItems() {
  var ids = pagesFor(activeCat)[pageNum - 1] || [];
  var s = ids.map(function(id){ return CELLS.filter(function(c){ return c.id === id; })[0]; }).filter(Boolean);
  // Remove duplicate filler cards: keep wp articles, remove s02, s03, s04
  s = s.filter(function(c){ return !['s02','s03','s04'].includes(c.id); });
  return (pageNum === 1 && document.getElementById('grid').clientWidth >= 480) ? CELLS.filter(function(c){ return c.logo; }).concat(s) : s;
}
function updatePager() {
  var pc = pageCount();
  var pager = document.getElementById('pager');
  pager.style.display = (pc > 1) ? 'flex' : 'none';
  pager.querySelector('#pg-num').textContent = pageNum + ' / ' + pc;
  pager.querySelector('#pg-prev').classList.toggle('disabled', pageNum <= 1);
  pager.querySelector('#pg-next').classList.toggle('disabled', pageNum >= pc);
}
function renderGrid(cat) {
  clearTimeout(armTimer); clearMq(document.querySelector('.cell.armed')); armedId = null;
  if (cat !== undefined) activeCat = cat;
  var pc = pageCount(); if (pageNum > pc) pageNum = pc; /* pageMap rebuild (resize) may shrink page count */
  var items = pageItems();
  var grid = document.getElementById('grid');
  grid.innerHTML = '';
  var narrow = window.innerWidth < 480 || /[?&]narrow=1/.test(location.search);
  grid.classList.toggle('desktop', !narrow);
    var W = grid.clientWidth, H = grid.clientHeight;
  var heroStory = narrow ? items.filter(function(c){ return c.full; })[0] : null;
  var heroH = 130;
  if (narrow && heroStory) H = Math.max(240, H - heroH);
  else heroH = 0;
  var layoutItems = narrow ? items.filter(function(c){ return !c.full; }) : items;
  if (narrow && !heroStory) { /* category w/o election: no reservation */ }
  var decayN = layoutItems.filter(function(c){ return !c.logo; }).length; /* story cells joining the decay ladder */
  var exp = narrow ? 2.2 : 1.7;                     /* V44 §1: desktop area ladder flattened (mobile keeps 2.2) */
  var tail = narrow ? 0.45 : 0.55;                  /* V44 §1: desktop last-rank tail (mobile keeps 0.45) */
  var q = decayN > 1 ? Math.pow(tail, 1/(decayN-1)) : 1;  /* last rank lands on tail — strict big→small */
  var r = 0;
  var leaves = layoutItems.map(function(c,i){
    return { i:i, v: (c.logo && narrow) ? 0 : (c.logo ? 6 : Math.pow(100 - c.tier*22, exp) * Math.pow(q, r++)) };
  });
  if (!narrow) { /* V44 s1 (V43 s4): logo value floor - reserve a >=72x28 slot so the leaf never collapses to zero width */
    var tot = 0;
    leaves.forEach(function(d){ if (!layoutItems[d.i].logo) tot += d.v; });
    leaves.forEach(function(d){ if (layoutItems[d.i].logo) d.v = Math.max(6, 72*28/(W*H)*tot); });
  }
  var root = d3.hierarchy({children: leaves}).sum(function(d){ return d.v || 0; });
  root.sort(function(a,b){ return b.value - a.value; });
  d3.treemap().tile(d3.treemapSquarify).size([W,H]).paddingInner(3).paddingOuter(0)(root);
  root.leaves().forEach(function(n){
    n.px0 = Math.max(0, Math.floor(n.x0)); n.py0 = Math.max(0, Math.floor(n.y0));
    n.px1 = Math.min(W, Math.ceil(n.x1));  n.py1 = Math.min(H, Math.ceil(n.y1));
    // P0-3: right edge card fix for narrow leaves (width <60px and near right edge)
    if ((n.px1 - n.px0) < 60 && n.px1 >= W - 8) {
        n.px0 = Math.max(0, W - 60);
        n.px1 = W;
    }
  });
  var rect = {};
  root.leaves().forEach(function(n){ rect[n.data.i] = n; });

  if (heroStory) {
    var hel = document.createElement('div');
    hel.className = 'cell p0';
    hel.style.left='0px'; hel.style.top='0px';
    hel.setAttribute('data-id', heroStory.id);
    hel.style.width=W+'px'; hel.style.height=heroH+'px';
    hel.innerHTML = '<div class="badge-row"><span class="red-badge">ELECTION 2026</span>' +
      dateHtml(heroStory, 'date-chip') + '</div>' +
      '<div class="cell-title" style="font-size:17px;">'+
      (heroStory.title||'').replace('ELECTION 2026 —','—')+'</div>' +
      '<div class="tag-row">'+(heroStory.tags||[]).map(function(t){return '<span>'+t+'</span>';}).join('')+'</div>' +
      '<div class="gap-callout"><span>GAP</span><b>3.1 pts</b><span>NAT 29.0 · LAB 25.9</span> · Curia 3 Sep</div>';
    wireCard(hel, heroStory);
    grid.appendChild(hel);
    }

  layoutItems.forEach(function(c, i){
    var n = rect[i];
    if (!n) return;
    var el = document.createElement('div');
    el.className = 'cell p' + c.tier;
    el.setAttribute('data-id', c.id);
    el.style.left = n.x0+'px'; el.style.top = n.y0+'px';
    el.style.width = (n.x1-n.x0)+'px'; el.style.height = (n.y1-n.y0)+'px';
    if (narrow) {
      el.style.top = (parseFloat(el.style.top||n.y0)+heroH)+'px';
    }
    if (c.logo) {
      if (narrow || (n.x1-n.x0) < 96) {
        el.innerHTML = '<div class="logo" style="font-size:8px;white-space:nowrap;overflow:hidden;">BEEHIVE</div>';
        grid.appendChild(el);
        return;
      }
      el.classList.add('logo-cell');
      el.innerHTML = '<div class="logo">BEE<b>HIVE</b></div><div class="logo-sub">NZ POLITICAL INTELLIGENCE</div>';
      grid.appendChild(el);
      return;
    }
    var w = n.x1-n.x0, h = n.y1-n.y0;
    var big = c.full && !narrow;
var sparkParty = { s05:'act' }[c.id];
    var tagsHtml = (c.tags||[]).map(function(t){return '<span>'+t+'</span>';}).join('');
    var showTagRow = !(c.tier === 3 && w < 148);
    var showSource = !(c.tier === 3 && w < 148);
    var html = (w >= 70 ? '<div class="badge-row date-only">' + dateHtml(c, 'date-dim' + (isOldDate(c.date) ? ' old-date' : '')) + '</div>' : '') +
      '<div class="cell-title">'+c.title+'</div>' +
      (showTagRow ? '<div class="tag-row">'+tagsHtml+'</div>' : '') +
      (showSource ? getSourceHtml(c) : '');
    if (big) {
      html += '<div class="election-chart"></div>' +
        '<div class="gap-callout"><span>NAT–LAB GAP</span><b>3.1 pts</b><span>NAT 29.0 · LAB 25.9</span> · Curia 3 Sep</div>' +
        '<div class="thresholds"></div>';
    } else if (((!narrow && w >= 180 && h >= 170) || (narrow && w >= 170 && h >= 130)) && sparkParty) {
      html += '<div class="spark-mini"></div>';
    }
    el.innerHTML = html;
    wireCard(el, c);
    grid.appendChild(el);
    if (big) {
      drawPollChart(el.querySelector('.election-chart'), Math.max(150, h*0.55));
      thresholdBars(el.querySelector('.thresholds'));
    } else if (sparkParty && el.querySelector('.spark-mini')) {
      var sparkH = narrow ? 48 : Math.max(48, Math.min(96, Math.round(h*0.30))); /* V44 §4: 160→48 · 240→72 · 265→80 · ≥320→96 cap */
      if (!narrow) el.querySelector('.spark-mini').style.height = sparkH + 'px';
      try { drawMiniSpark(el.querySelector('.spark-mini'), sparkParty, sparkH); }
      catch(e) { document.title = 'SPARKERR ' + c.id + ': ' + e.message; }
    }
  });
  updatePager();
  requestAnimationFrame(function(){ if (!narrow) fitTitleAll(grid); fitAudit(grid); });
}

    "p": "Chris Hipkins unveiled Labour's KiwiSaver policy on Sunday from a Sharesies office in Wellington. The centrepiece is compulsory employer contribution: from 1 July 2028, employers must pay into every staff member's scheme. Two groups currently outside or loosely attached to the arrangement are brought in — workers on paid parental leave, and workers over 65. The minimum employer rate rises to 6 percent by 2032, and the party intends that floor to hold even when an employee reduces or pauses their own payments. Employees keep a 4 percent default, while the minimum employee rate is removed, giving workers more freedom to adjust their own contribution. Labour would also ban new total-remuneration contracts, which absorb KiwiSaver into salary so that an employee sees a single higher number on the payslip rather than a separate superannuation line."

  "sections": [{"h": "Policy reversal on fuel tax", "p": "The coalition government has cancelled the fuel tax increase that was set to take effect on 1 January 2027. Under the original plan, fuel taxes (including road user charges) would have risen by 12 cents per litre from that date. The new approach introduces a smaller first step: a 5 cent per litre increase from 1 January 2028. Thereafter, the tax will rise by another 5 cents every six months, so that by the end of 2029 the cumulative increase will be 20 cents per litre. From 2030 onward, the increase will revert to an annual 5 cent step, again inclusive of road user charges. The shift means the total additional cost to motorists over the next few years is lower than initially planned, though the tax will still climb over the decade."}, {"h": "Financing the Transport Fund", "p": "To offset the loss of revenue from the cancelled 12 cent increase, the government will top up the National Land Transport Fund by $1.476 billion over the forecast period. Of that sum, $450 million comes from the fuel‑response contingency established in Budget 2026; the balance will be covered through the Pre‑Election Fiscal Update (PREFU). Transport Minister Chris Bishop warned that without the NLTF top‑up, road maintenance, public transport and infrastructure would face \"significant\" cuts. Finance Minister Nicola Willis said the $1 billion shortfall would be reflected in the PREFU at the end of September. The government’s move contrasts with Labour’s election promise to freeze the fuel tax for three years if it wins office; Labour leader Chris Hipkins has argued that New Zealanders “simply cannot afford an extra 22 cents a litre”, warning that a Labour‑led freeze would leave the NLTF $4.6 billion worse off."}, {"h": "Political Reactions and Timing", "p": "Prime Minister Christopher Luxon denied that the reversal was motivated by electoral considerations, attributing the change to “changing circumstances and changing geopolitics”. He   "sections": [{"h": "NZ First announces immigration overhaul", "p": "On 11 September 2026, New Zealand First released a suite of 13 or more immigration policy proposals intended to shape the party’s platform for the November general election. The centrepiece is a binding referendum that would set an annual ceiling of 20 000 resident visas, linked to a 30‑year planning framework that coordinates immigration, housing and infrastructure. The package also tightens the path to citizenship: children born in New Zealand would no longer acquire automatic citizenship unless at least one parent is a citizen, permanent residence would be extended from two years to five years, and the qualifying period for citizenship would rise from five years to a minimum of ten years. A ten‑year stand‑down on most welfare benefits would apply to non‑citizens, meaning they could not access Jobseeker Support or the Accommodation Supplement during their first decade in the country."}, {"h": "Enforcement and eligibility changes", "p": "The proposal widens the grounds for deportation so that any offence punishable by imprisonment could lead to removal from the country. Certain categories – violent or sexual offences, fraud, organised crime, money‑laundering and exploitation – would trigger automatic deportation. Asylum seekers would see their protected‑person status changed from indefinite to temporary, subject to continuous review. Overstayers who voluntarily present themselves for departure within 24 months would be granted an amnesty with no bar on future re‑entry; after that period, detection would result in deportation and a permanent ban on returning. International students would lose the automatic right to work while studying and would have to leave New Zealand before applying for a different visa type. Social‑rental housing would be allocated to citizens first, and the fees for residence and citizenship applications would increase from $641 to $950 and from $315 to $630 respectively."}, er registration, exacerbating domestic shortfalls. Waiting times for elective surgery and outpatient consultations have risen steadily, becoming a frequent topic in public debate and election coverage. Labour’s campaign has highlighted the graduate‑nurse guarantee as a way to offer immediate employment certainty, countering the perception that training investment is lost when nurses emigrate. By tying qualification to a guaranteed public‑sector role, the party seeks to strengthen the domestic pipeline and improve timely access to care for the population. The guarantee is presented as one pillar of Labour’s wider election commitment to rebuild the health workforce and reduce reliance on costly temporary staffing agencies."}]

/* ── Pagination: GSAP page-flip ────────────────────────────── */
function goToPage(np, dir) {
  if (flipping || np === pageNum || np < 1 || np > pageCount()) return;
  pageNum = np;
  flipping = true;
  updatePager();
  var animate = !reduced;
  if (animate) {
    /* exit: whole batch slides out toward -dir, 12ms stagger */
    gsap.to(document.querySelectorAll('#grid .cell'),
      { x: -40 * dir, opacity: 0, duration: 0.18, stagger: 0.012, ease: 'power2.in' });
  }
  /* state transitions run on timers so the flip never stalls,
     even where rAF is throttled (hidden tabs); GSAP is paint only */
  setTimeout(function() {
    renderGrid();
    if (animate) {
      var fresh = document.querySelectorAll('#grid .cell');
      /* enter: new batch slides in from +dir, 12ms stagger */
      gsap.fromTo(fresh,
        { x: 40 * dir, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.2, stagger: 0.012, ease: 'power2.out' });
      /* settle guard: where the GSAP ticker never ticks (headless capture,
         hidden tabs) the enter tween's immediateRender leaves cells at
         opacity 0 — strip inline animation styles once the tween window
         has passed; a no-op in browsers where the tween completed */
      setTimeout(function() {
        fresh.forEach(function(el) { el.style.transform = ''; el.style.opacity = ''; });
      }, 560);
    }
    setTimeout(function() { flipping = false; }, animate ? 480 : 0);
  }, animate ? 240 : 0);
}
(function initPager(){
  document.getElementById('pg-prev').addEventListener('click', function(){ goToPage(pageNum - 1, -1); });
  document.getElementById('pg-next').addEventListener('click', function(){ goToPage(pageNum + 1, 1); });
  window.addEventListener('keydown', function(e) {
    if (!document.getElementById('treemap-view').classList.contains('active')) return;
    if (e.key === 'ArrowRight') goToPage(pageNum + 1, 1);
    else if (e.key === 'ArrowLeft') goToPage(pageNum - 1, -1);
  });
  var tsX = null, tsY = null;
  document.getElementById('grid').addEventListener('touchstart', function(e) {
    tsX = e.touches[0].clientX; tsY = e.touches[0].clientY;
  }, { passive: true });
  document.getElementById('grid').addEventListener('touchend', function(e) {
    if (tsX === null) return;
    var dx = e.changedTouches[0].clientX - tsX;
    var dy = e.changedTouches[0].clientY - tsY;
    tsX = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) {
      if (dx < 0) goToPage(pageNum + 1, 1); else goToPage(pageNum - 1, -1);
    }
  }, { passive: true });
  /* demo/test hook: ?flip=1 auto-flips to page 2 after load */
  if (/[?&]flip=1(\b|$)/.test(location.search)) {
    setTimeout(function(){ goToPage(2, 1); }, 900);
  }
})();

/* ── Boot ──────────────────────────────────────────────────── */
document.getElementById('grid').addEventListener('click', function(e){
  if (!e.target.closest('.cell')) clearMq(document.querySelector('.cell.armed'));
});
renderGrid();
var rs;
window.addEventListener('resize', function(){
  clearTimeout(rs);
  rs = setTimeout(function(){
    if (document.getElementById('treemap-view').classList.contains('active')) renderGrid();
  }, 200);
});
</script>
</body>
</html>
