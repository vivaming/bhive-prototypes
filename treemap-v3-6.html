/* ── Charts ────────────────────────────────────────────────── */
function drawPollChart(container, h) {
  /* Cover card: brief-page main chart DNA — TWO MAJOR PARTIES ONLY (National vs Labour),
     model lines + confidence bands + poll dots + right-edge name/value labels,
     dashed % gridlines, Today anchor, teal under-5% zone. Mini-sparkline projection style. */
  var w = container.clientWidth || 400;
  var svg = d3.select(container).append('svg').attr('viewBox', '0 0 '+w+' '+h)
    .attr('preserveAspectRatio','none');
  var labelW = w < 340 ? 56 : 92;
  var x = d3.scaleLinear().domain([0, 9]).range([8, w-labelW]);
  var y = d3.scaleLinear().domain([20, 42]).range([h-16, 8]);
  // dashed gridlines with % labels on right (house style) — domain fits the two majors
  [20,25,30,35,40].forEach(function(v){
    svg.append('line').attr('x1',10).attr('x2',w-labelW).attr('y1',y(v)).attr('y2',y(v))
      .attr('stroke','rgba(255,255,255,0.14)').attr('stroke-dasharray','2,4');
    svg.append('text').attr('x',w-labelW+6).attr('y',y(v)+3)
      .attr('font-size',8).attr('fill','#6b7684').text(v+'%');
  });
  svg.append('line').attr('x1',x(8.6)).attr('x2',x(8.6)).attr('y1',6).attr('y2',h-16)
    .attr('stroke','rgba(255,255,255,0.5)');
  svg.append('text').attr('x',x(8.6)).attr('y',4).attr('text-anchor','middle')
    .attr('font-size',8).attr('letter-spacing','0.1em').attr('fill','#9aa7b4').text('TODAY');
  ['national','labour'].forEach(function(k){
    var c = PARTY[k].color;
    var data = POLL_HISTORY[k];
    svg.append('path').datum(data)
      .attr('d', d3.area().x(function(d,i){return x(i);})
        .y0(function(d){return y(d-1.3);}).y1(function(d){return y(d+1.3);})
        .curve(d3.curveMonotoneX))
      .attr('fill',c).attr('opacity',0.16);
    svg.selectAll(null).data(data).enter().append('circle')
      .attr('cx',function(d,i){return x(i);}).attr('cy',function(d){return y(d);})
      .attr('r',2.2).attr('fill',c).attr('opacity',0.45);
    svg.append('path').datum(data)
      .attr('d', d3.line().x(function(d,i){return x(i);}).y(function(d){return y(d);})
        .curve(d3.curveMonotoneX))
      .attr('fill','none').attr('stroke',c).attr('stroke-width',2);
    var last = data[data.length-1];
    var ly = y(last);
    svg.append('circle').attr('cx',x(9)).attr('cy',ly).attr('r',3.2).attr('fill',c);
    svg.append('line').attr('x1',x(9)+5).attr('y1',ly).attr('x2',w-labelW+6).attr('y2',ly)
      .attr('stroke',c).attr('stroke-dasharray','2,3').attr('opacity',0.8);
    var nameFs = w < 340 ? 8 : 10;
    var valFs = w < 340 ? 8.5 : 9.5;
    svg.append('text').attr('x',w-labelW+6).attr('y',ly-2)
      .attr('font-size',nameFs).attr('font-weight',600).attr('fill',c).text(PARTY[k].name);
    svg.append('text').attr('x',w-labelW+6).attr('y',ly+9)
      .attr('font-size',valFs).attr('fill','#c7cfd8').text(last+'%');
  });
  var months = ['May','Jul','Sep','Nov','Jan','Mar','May','Jul'];
  months.forEach(function(m,i){
    svg.append('text').attr('x', x(i*9/(months.length-1))).attr('y', h-4)
      .attr('font-size',8).attr('fill','#6b7684').attr('text-anchor','middle').text(m);
  });
}

function drawMiniSpark(container, partyKey, h) {
  var data = POLL_HISTORY[partyKey] || POLL_HISTORY.national;
  var w = container.clientWidth || 120;
  var c = PARTY[partyKey] ? PARTY[partyKey].color : '#8895a7';
  var svg = d3.select(container).append('svg').attr('viewBox','0 0 '+w+' '+h)
    .attr('preserveAspectRatio','none');
  var x = d3.scaleLinear().domain([0, data.length-1]).range([2, w-14]);
  var lo = Math.min.apply(null, data) - 1.5, hi = Math.max.apply(null, data) + 1.5;
  var y = d3.scaleLinear().domain([lo, hi]).range([h-3, 3]);
  svg.append('path').datum(data)
    .attr('d', d3.area().x(function(d,i){return x(i);})
      .y0(function(d){return y(d-0.9);}).y1(function(d){return y(d+0.9);})
      .curve(d3.curveMonotoneX))
    .attr('fill',c).attr('opacity',0.10);
  svg.append('path').datum(data)
    .attr('d', d3.line().x(function(d,i){return x(i);}).y(function(d){return y(d);})
      .curve(d3.curveMonotoneX))
    .attr('fill','none').attr('stroke',c).attr('stroke-width',1.25);
  var last = data[data.length-1];
  svg.append('circle').attr('cx',x(data.length-1)).attr('cy',y(last)).attr('r',2.4).attr('fill',c);
  svg.append('text').attr('x',w-1).attr('y',y(last)+3).attr('text-anchor','end')
    .attr('font-size',9).attr('font-weight',700).attr('fill',c).text(last+'%');
}

function thresholdBars(container) {
  var html = '<div class="th-line" style="left:'+(5/45*100)+'%"></div>' +
    '<div class="th-label" style="left:'+(5/45*100)+'%">5%</div>';
  Object.keys(PARTY).forEach(function(k){
    var p = PARTY[k];
    var w = Math.min(100, p.poll/45*100);
    html += '<div class="th-row"><div class="th-name">'+p.name+'</div>' +
      '<div class="th-track"><div class="th-bar'+(p.reached?'':' below')+
      '" style="width:'+w+'%; background:'+p.color+'"></div></div>' +
      '<div class="th-val">'+p.poll+'%</div></div>';
  });
  html += '<div class="mmp-note">MMP: a party enters Parliament by clearing 5% party vote OR winning one electorate seat.</div>';
  container.innerHTML = html;
}

function legendRow() {
  var html = '';
  Object.keys(PARTY).forEach(function(k){
    html += '<span class="li"><span class="dot" style="background:'+PARTY[k].color+'"></span>'+PARTY[k].name+'</span>';
  });
  return html;
}

/* ── Treemap layout ────────────────────────────────────────── */
var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

var activeCat = 'all';
var PAGE_SIZE = 20, pageNum = 1, flipping = false;
function catStories() {
  var s = CELLS.filter(function(c){ return !c.logo && (activeCat === 'all' || c.cat === activeCat); });
  s.sort(function(a, b){ return a.tier - b.tier; }); /* stable: hot-first array order within tier */
  return s;
}
function pageCount() { return Math.max(1, Math.ceil(catStories().length / PAGE_SIZE)); }
function pageItems() {
  var s = catStories().slice((pageNum - 1) * PAGE_SIZE, pageNum * PAGE_SIZE);
  return (pageNum === 1) ? s.concat(CELLS.filter(function(c){ return c.logo; })) : s;
}
function updatePager() {
  var pc = pageCount();
  var pager = document.getElementById('pager');
  pager.style.display = (pc > 1) ? 'flex' : 'none';
  pager.querySelector('#pg-num').textContent = pageNum + ' / ' + pc;
  pager.querySelector('#pg-prev').classList.toggle('disabled', pageNum <= 1);
  pager.querySelector('#pg-next').classList.toggle('disabled', pageNum >= pc);
}
document.getElementById('pg-prev').addEventListener('click', function(){ goToPage(pageNum - 1, -1); });
document.getElementById('pg-next').addEventListener('click', function(){ goToPage(pageNum + 1, 1); });
document.addEventListener('keydown', function(e){
  if (e.key === 'ArrowLeft') goToPage(pageNum - 1, -1);
  if (e.key === 'ArrowRight') goToPage(pageNum + 1, 1);
});
var touchX = null;
document.addEventListener('touchstart', function(e){ touchX = e.touches[0].clientX; }, {passive:true});
document.addEventListener('touchend', function(e){
  if (touchX === null) return;
  var dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 60) goToPage(pageNum + (dx < 0 ? 1 : -1), dx < 0 ? 1 : -1);
  touchX = null;
}, {passive:true});
function renderGrid(cat) {
  if (cat !== undefined) activeCat = cat;
  var items = pageItems();
  var grid = document.getElementById('grid');
  grid.innerHTML = '';
  var narrow = grid.clientWidth < 480;
  var W = grid.clientWidth, H = grid.clientHeight;
  var heroEl = null, heroH = 248;
  if (narrow) H = H - heroH;
  var root = d3.hierarchy({children: items.map(function(c,i){
    return { i:i, v: c.logo ? 6 : Math.pow(100 - c.tier*22, 1.3) };
  })}).sum(function(d){ return d.v || 0; });
  root.sort(function(a,b){ return b.value - a.value; });
  d3.treemap().tile(d3.treemapSquarify).size([W,H]).paddingInner(3).paddingOuter(0)(root);
  var leaves = root.leaves();
  items.forEach(function(c, i){
    var n = leaves[i];
    var el = document.createElement('div');
    el.className = 'cell p' + c.tier;
    el.setAttribute('data-id', c.id);
    el.style.left = n.x0+'px'; el.style.top = n.y0+'px';
    el.style.width = (n.x1-n.x0)+'px'; el.style.height = (n.y1-n.y0)+'px';
    if (c.full && narrow) {
      heroEl = el;
      el.style.left='0px'; el.style.top='0px';
      el.style.width=W+'px'; el.style.height=heroH+'px';
      var nhtml = '<div class="badge-row"><span class="red-badge">ELECTION 2026</span>' +
        '<span class="date-chip">'+c.date+'</span></div>' +
        '<div class="cell-title" style="font-size:18px;"><span style="color:#ff6b70">ELECTION 2026</span>'+c.title.replace('ELECTION 2026 —','—')+'</div>' +
        '<div class="election-chart"></div>';
      el.innerHTML = nhtml;
      el.addEventListener('click', function(){ openArticle(c); });
      grid.appendChild(el);
      var ec = el.querySelector('.election-chart');
      ec.style.height = '120px'; ec.style.flex = 'none';
      drawPollChart(ec, 120);
      return;
    }
    if (narrow) {
      el.style.top = (parseFloat(el.style.top||n.y0)+heroH)+'px';
    }
    if (c.logo) {
      if ((n.x1-n.x0) < 96) {
        el.innerHTML = '<div class="cell-title" style="white-space:nowrap;text-overflow:ellipsis;display:block;-webkit-line-clamp:unset;">'+c.title+'</div>';
        el.addEventListener('click', function(){ openArticle(c); });
        grid.appendChild(el);
        return;
      }
      el.classList.add('logo-cell');
      el.innerHTML = '<div class="logo">BEE<b>HIVE</b></div><div class="logo-sub">NZ POLITICAL INTELLIGENCE</div>';
      grid.appendChild(el);
      return;
    }
    var w = n.x1-n.x0, h = n.y1-n.y0;
    var big = c.full && !narrow;
    var sparkParty = { s02:'nzfirst', s03:'act', s04:'labour', s05:'act', s06:'national',
      s07:'green', s08:'green', s09:'national', s10:'labour', s11:'national',
      s12:'nzfirst', s13:'act' }[c.id];
    var html = '<div class="badge-row'+(c.tier===0?'':' date-only')+'">' +
      (c.tier===0?'<span class="red-badge">ELECTION 2026</span>':'') +
      '<span class="date-dim">'+(c.date||'')+'</span></div>' +
      '<div class="cell-title">'+c.title+'</div>' +
      '<div class="tag-row">'+(c.tags||[]).map(function(t){return '<span>'+t+'</span>';}).join('')+'</div>';
    if (big) {
      html += '<div class="election-chart"></div>' +
        '<div class="gap-callout"><span>NATIONAL-LET GAP</span><b>10.3 pts</b><span>Labour 28.2 · National 38.5</span></div>' +
        '<div class="thresholds"></div>';
    } else if (w >= 170 && h >= 130 && sparkParty) {
      html += '<div class="spark-mini"></div>';
    }
    el.innerHTML = html;
    el.addEventListener('click', function(){ openArticle(c); });
    grid.appendChild(el);
    if (big) {
      drawPollChart(el.querySelector('.election-chart'), Math.max(150, h*0.55));
      thresholdBars(el.querySelector('.thresholds'));
    } else if (sparkParty && el.querySelector('.spark-mini')) {
      try { drawMiniSpark(el.querySelector('.spark-mini'), sparkParty, 48); }
      catch(e) { document.title = 'SPARKERR ' + c.id + ': ' + e.message; }
    }
  });
  updatePager();
}

/* ── Article view ──────────────────────────────────────────── */
function openArticle(c) {
  document.getElementById('treemap-view').classList.remove('active');
  var av = document.getElementById('article-view');
  av.classList.add('active');
  av.querySelector('.a-badge').textContent = c.tier===0 ? 'ELECTION 2026' : (c.priority || 'STORY');
  document.getElementById('a-title').textContent = c.title;
  document.getElementById('a-date').textContent = (c.date||'') + ' · Beehive Political Intelligence · Sample article';
  var bodyEl = document.getElementById('a-body');
  if (c.full) {
    bodyEl.innerHTML =
      '<p>With the campaign underway, the polling aggregate places National on 38.5 per cent and Labour on 28.2 — a nine-point gap that has held for three consecutive months. The centre-right bloc (National, ACT, NZ First) sits on roughly 55.8 per cent of the party vote, against 39.6 for the left (Labour, Green), leaving the kingmaker arithmetic resting with whichever minor party clears the threshold.</p>' +
      '<p>The 5 per cent threshold remains the sharpest instrument in the room. ACT (13.1) and the Greens (11.4) are comfortably returned. NZ First, on 4.2 per cent, is the story: below the line in the polls, but historically rescued by an electorate seat. Te Pāti Māori is not modelled here — its pathway runs through the Māori electorates, not the party vote — but it functions as the same kind of jitter in the maths.</p>' +
      '<p>Three things would move this picture: a shift of two points either way for National or Labour; NZ First crossing or decisively missing the threshold; and the coalition negotiations that follow. Until one of those occurs, the polls describe a likely centre-right government with a scramble for its third chair.</p>';
    var ch = document.getElementById('a-chart');
    ch.innerHTML = '';
    requestAnimationFrame(function(){ drawPollChart(ch, 260); });
  } else {
    bodyEl.innerHTML =
      '<p>[Placeholder article — full reporting to be produced by the editorial pipeline.]</p>' +
      '<p>This story is tracked by the Beehive discovery pipeline and will receive a full evidence-led briefing when the news cycle warrants it.</p>';
    document.getElementById('a-chart').style.display = 'none';
  }
  av.scrollTop = 0;
}
function showTreemap() {
  document.getElementById('article-view').classList.remove('active');
  document.getElementById('treemap-view').classList.add('active');
  document.getElementById('a-chart').style.display = '';
}

/* ── Category filter ───────────────────────────────────────── */
var CATS = [
  { key:'all', label:'All' },
  { key:'politics', label:'Politics' },
  { key:'economy', label:'Economy' },
  { key:'finance', label:'Finance' },
  { key:'international', label:'International' }
];
var catTimer = null;
function setCat(cat) {
  pageNum = 1;
  document.querySelectorAll('.cat-pill').forEach(function(p){
    p.classList.toggle('active', p.dataset.cat === cat);
  });
  var fading = 0;
  if (cat !== 'all' && !reduced) {
    document.querySelectorAll('#grid .cell').forEach(function(el){
      var c = CELLS.filter(function(x){ return x.id === el.dataset.id; })[0];
      if (c && !c.logo && c.cat !== cat) {
        el.style.transition = 'opacity .18s ease-out';
        el.style.opacity = '0';
        el.style.pointerEvents = 'none';
        fading++;
      }
    });
  }
  clearTimeout(catTimer);
  catTimer = setTimeout(function(){ renderGrid(cat); }, fading ? 160 : 0);
}
(function initCatBar(){
  var bar = document.getElementById('cat-bar');
  bar.innerHTML = CATS.map(function(c){
    return '<button type="button" class="cat-pill'+(c.key==='all'?' active':'')+
      '" data-cat="'+c.key+'">'+c.label+'</button>';
  }).join('');
  bar.querySelectorAll('.cat-pill').forEach(function(p){
    p.addEventListener('click', function(){
      if (p.dataset.cat !== activeCat) setCat(p.dataset.cat);
    });
  });
})();

/* ── Pagination: GSAP page-flip ────────────────────────────── */
function goToPage(np, dir) {
  if (flipping || np === pageNum || np < 1 || np > pageCount()) return;
  pageNum = np;
  flipping = true;
  updatePager();
  var animate = !reduced && !!window.gsap;
  if (animate) {
    /* exit: whole batch slides out toward -dir, 12ms stagger */
    gsap.to(document.querySelectorAll('#grid .cell'),
      { x: -40 * dir, opacity: 0, duration: 0.18, stagger: 0.012, ease: 'power2.in' });
  }
  /* state transitions run on timers so the flip never stalls,
     even where rAF is throttled (hidden tabs); GSAP is paint only */
  setTimeout(function() {
    renderGrid();
    if (animate) {
      var fresh = document.querySelectorAll('#grid .cell');
      /* enter: new batch slides in from +dir, 12ms stagger */
      gsap.fromTo(fresh,
        { x: 40 * dir, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.2, stagger: 0.012, ease: 'power2.out' });
      /* settle guard: where the GSAP ticker never ticks (headless capture,
         hidden tabs) the enter tween's immediateRender leaves cells at
         opacity 0 — strip inline animation styles once the tween window
         has passed; a no-op in browsers where the tween completed */
      setTimeout(function() {
        fresh.forEach(function(el) { el.style.transform = ''; el.style.opacity = ''; });
      }, 560);
    }
    setTimeout(function() { flipping = false; }, animate ? 480 : 0);
  }, animate ? 240 : 0);
}
(function initPager(){
  document.getElementById('pg-prev').addEventListener('click', function(){ goToPage(pageNum - 1, -1); });
  document.getElementById('pg-next').addEventListener('click', function(){ goToPage(pageNum + 1, 1); });
  window.addEventListener('keydown', function(e) {
    if (!document.getElementById('treemap-view').classList.contains('active')) return;
    if (e.key === 'ArrowRight') goToPage(pageNum + 1, 1);
    else if (e.key === 'ArrowLeft') goToPage(pageNum - 1, -1);
  });
  var tsX = null, tsY = null;
  document.getElementById('grid').addEventListener('touchstart', function(e) {
    tsX = e.touches[0].clientX; tsY = e.touches[0].clientY;
  }, { passive: true });
  document.getElementById('grid').addEventListener('touchend', function(e) {
    if (tsX === null) return;
    var dx = e.changedTouches[0].clientX - tsX;
    var dy = e.changedTouches[0].clientY - tsY;
    tsX = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) {
      if (dx < 0) goToPage(pageNum + 1, 1); else goToPage(pageNum - 1, -1);
    }
  }, { passive: true });
  /* demo/test hook: ?flip=1 auto-flips to page 2 after load */
  if (/[?&]flip=1(\b|$)/.test(location.search)) {
    setTimeout(function(){ goToPage(2, 1); }, 900);
  }
})();

/* ── Boot ──────────────────────────────────────────────────── */
renderGrid();
var rs;
window.addEventListener('resize', function(){
  clearTimeout(rs);
  rs = setTimeout(function(){
    if (document.getElementById('treemap-view').classList.contains('active')) renderGrid();
  }, 200);
});
</script>
